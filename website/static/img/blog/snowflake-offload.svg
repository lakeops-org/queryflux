<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Snowflake clients through QueryFlux offloading to Trino or StarRocks or Snowflake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff7619"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="380" rx="20" fill="url(#bg)"/>
  <rect width="960" height="380" rx="20" fill="url(#glow)"/>
  <rect width="960" height="380" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="378" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">How offload works</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Snowflake clients keep talking Snowflake. QueryFlux decides who runs the session.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="120" width="200" height="160" rx="16" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
    <text x="140" y="158" text-anchor="middle" fill="#ffedd5" font-size="14" font-weight="650">Snowflake clients</text>
    <text x="140" y="188" text-anchor="middle" fill="#fdba74" font-size="12">Python connector</text>
    <text x="140" y="212" text-anchor="middle" fill="#fdba74" font-size="12">JDBC / SnowSQL</text>
    <text x="140" y="246" text-anchor="middle" fill="#a16207" font-size="11" font-family="ui-monospace, Menlo, monospace">same login UX</text>

    <path d="M240 200 H288" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="290" y="110" width="220" height="180" rx="16" fill="rgba(139,92,246,0.14)" stroke="url(#qf)" stroke-width="1.75"/>
    <text x="400" y="150" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="650">QueryFlux</text>
    <text x="400" y="176" text-anchor="middle" fill="#c4b5fd" font-size="12">Snowflake HTTP frontend</text>
    <text x="400" y="202" text-anchor="middle" fill="#a78bfa" font-size="11">+ SQL API v2</text>
    <rect x="314" y="220" width="172" height="48" rx="10" fill="rgba(0,0,0,0.28)"/>
    <text x="400" y="240" text-anchor="middle" fill="#e9d5ff" font-size="11">route by warehouse</text>
    <text x="400" y="258" text-anchor="middle" fill="#a78bfa" font-size="10">role / user / session</text>

    <path d="M510 160 C560 160, 560 120, 610 120" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#arrG)"/>
    <path d="M510 240 C560 240, 560 280, 610 280" fill="none" stroke="#fdba74" stroke-width="2" marker-end="url(#arrO)"/>

    <text x="560" y="100" fill="#86efac" font-size="11" font-weight="600">BI and exploration</text>
    <text x="560" y="304" fill="#fdba74" font-size="11" font-weight="600">everything else</text>

    <rect x="610" y="78" width="310" height="90" rx="14" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.45)"/>
    <text x="765" y="114" text-anchor="middle" fill="#ecfccb" font-size="14" font-weight="650">Trino or StarRocks</text>
    <text x="765" y="140" text-anchor="middle" fill="#bef264" font-size="12">reads your Iceberg tables</text>
    <text x="765" y="158" text-anchor="middle" fill="#4d7c0f" font-size="10" font-family="ui-monospace, Menlo, monospace">sqlglot: Snowflake dialect to engine</text>

    <rect x="610" y="238" width="310" height="90" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)"/>
    <text x="765" y="274" text-anchor="middle" fill="#f4f4f5" font-size="14" font-weight="650">Snowflake</text>
    <text x="765" y="300" text-anchor="middle" fill="#a1a1aa" font-size="12">through ADBC - unchanged path</text>
    <text x="765" y="318" text-anchor="middle" fill="#71717a" font-size="10" font-family="ui-monospace, Menlo, monospace">warehouse time when you need it</text>
  </g>

  <text x="480" y="360" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Dashboards keep Snowflake connection strings - only the host points at QueryFlux.</text>
</svg>
