<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Where Apache Ossie fits: metric definitions that live today in dbt, Snowflake, Salesforce, GoodData and BI tools convert into one Ossie model. Agents, BI tools and notebooks query through QueryFlux, which reads the Ossie model, compiles it with ossiec, applies governance and runs it on Trino, StarRocks, ClickHouse, Snowflake and other engines over Iceberg tables.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="470" rx="20" fill="url(#bg)"/>
  <rect width="960" height="470" rx="20" fill="url(#glow)"/>
  <rect width="960" height="470" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="468" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="42" fill="#fafafa" font-size="18" font-weight="650">Define meaning once. Execute it everywhere.</text>
    <text x="40" y="66" fill="#a1a1aa" font-size="12">Ossie holds the definition. ossiec turns it into SQL. QueryFlux decides where it runs and who may see what.</text>

    <!-- Column 1: where definitions live today -->
    <text x="130" y="108" text-anchor="middle" fill="#a1a1aa" font-size="11" font-weight="600" letter-spacing="0.06em">DEFINED TODAY IN</text>
    <g font-size="11" fill="#d4d4d8" text-anchor="middle">
      <rect x="40" y="122" width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="130" y="141">dbt Semantic Layer</text>
      <rect x="40" y="160" width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="130" y="179">Snowflake semantic views</text>
      <rect x="40" y="198" width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="130" y="217">Salesforce / Tableau</text>
      <rect x="40" y="236" width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="130" y="255">GoodData</text>
      <rect x="40" y="274" width="180" height="30" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="130" y="293">a BI tool, a notebook, a prompt…</text>
    </g>
    <text x="130" y="326" text-anchor="middle" fill="#71717a" font-size="10">each with its own copy of "revenue"</text>

    <line x1="222" y1="213" x2="266" y2="213" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>
    <text x="244" y="200" text-anchor="middle" fill="#a78bfa" font-size="9">convert</text>

    <!-- Column 2: Ossie -->
    <rect x="270" y="122" width="190" height="182" rx="16" fill="rgba(139,92,246,0.16)" stroke="#8b5cf6" stroke-width="1.75"/>
    <text x="365" y="152" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="650">Apache Ossie</text>
    <text x="365" y="170" text-anchor="middle" fill="#c4b5fd" font-size="10">one vendor-neutral YAML model</text>
    <g font-size="11" fill="#ede9fe">
      <text x="296" y="198">datasets + primary keys</text>
      <text x="296" y="218">fields + dimensions</text>
      <text x="296" y="238">relationships</text>
      <text x="296" y="258">metrics</text>
      <text x="296" y="278">ai_context</text>
    </g>

    <!-- Catalog (roadmap) -->
    <rect x="270" y="346" width="190" height="62" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.2)" stroke-dasharray="5 4"/>
    <text x="365" y="372" text-anchor="middle" fill="#d4d4d8" font-size="12" font-weight="600">Catalog (Apache Polaris)</text>
    <text x="365" y="391" text-anchor="middle" fill="#71717a" font-size="10">models found beside tables · proposed</text>
    <line x1="365" y1="306" x2="365" y2="342" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>

    <line x1="462" y1="213" x2="506" y2="213" stroke="#86efac" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="484" y="200" text-anchor="middle" fill="#86efac" font-size="9">execute</text>

    <!-- Consumers -->
    <rect x="510" y="86" width="230" height="40" rx="10" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.25"/>
    <text x="625" y="111" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="600">Agents (MCP) · BI · notebooks</text>
    <line x1="625" y1="127" x2="625" y2="148" stroke="#fdba74" stroke-width="2" marker-end="url(#arrO)"/>

    <!-- Column 3: QueryFlux -->
    <rect x="510" y="150" width="230" height="200" rx="16" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="625" y="178" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="650">QueryFlux</text>
    <rect x="530" y="192" width="190" height="40" rx="9" fill="rgba(134,239,172,0.08)" stroke="#86efac" stroke-opacity="0.5"/>
    <text x="625" y="210" text-anchor="middle" fill="#dcfce7" font-size="12" font-weight="600">ossiec</text>
    <text x="625" y="225" text-anchor="middle" fill="#86efac" font-size="10">metrics → correct SQL per engine</text>
    <rect x="530" y="240" width="190" height="40" rx="9" fill="rgba(0,0,0,0.28)"/>
    <text x="625" y="258" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="600">route</text>
    <text x="625" y="273" text-anchor="middle" fill="#c4b5fd" font-size="10">pick the engine per query</text>
    <rect x="530" y="288" width="190" height="48" rx="9" fill="rgba(0,0,0,0.28)"/>
    <text x="625" y="307" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="600">govern + record</text>
    <text x="625" y="324" text-anchor="middle" fill="#c4b5fd" font-size="10">guardrails · row filters · history</text>

    <line x1="742" y1="250" x2="776" y2="250" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Column 4: engines -->
    <rect x="780" y="150" width="140" height="200" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.18)"/>
    <text x="850" y="178" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="650">Engines</text>
    <g font-size="11" fill="#d4d4d8" text-anchor="middle">
      <text x="850" y="208">Trino</text>
      <text x="850" y="230">StarRocks</text>
      <text x="850" y="252">ClickHouse</text>
      <text x="850" y="274">Snowflake</text>
      <text x="850" y="296">DuckDB, Postgres…</text>
    </g>

    <!-- Storage -->
    <rect x="510" y="370" width="410" height="38" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)"/>
    <text x="715" y="394" text-anchor="middle" fill="#a1a1aa" font-size="11">open tables underneath: Apache Iceberg on object storage</text>

    <text x="40" y="440" fill="#71717a" font-size="10">Converters exist in apache/ossie-converters. Catalog discovery is a roadmap proposal. QueryFlux's semantic tools are planned; ossiec is available today.</text>
  </g>
</svg>
