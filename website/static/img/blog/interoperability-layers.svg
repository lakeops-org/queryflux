<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Open table formats vs query engine silos">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="16" fill="#0c0a12"/>
  <text x="460" y="42" text-anchor="middle" fill="#fafafa" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Data is open. Engines still aren&apos;t.</text>

  <rect x="80" y="70" width="760" height="72" rx="12" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.35)" stroke-width="1"/>
  <text x="460" y="98" text-anchor="middle" fill="#a3e635" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Open table formats (Iceberg, etc.)</text>
  <text x="460" y="122" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">One copy of data, many readers</text>

  <text x="460" y="168" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">protocols, dialects, and credentials multiply</text>

  <rect x="80" y="188" width="170" height="88" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="165" y="228" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="13">Trino</text>
  <text x="165" y="252" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">HTTP + SQL A</text>

  <rect x="275" y="188" width="170" height="88" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="360" y="228" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="13">DuckDB</text>
  <text x="360" y="252" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">in-process</text>

  <rect x="470" y="188" width="170" height="88" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="555" y="228" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="13">StarRocks</text>
  <text x="555" y="252" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">MySQL wire</text>

  <rect x="665" y="188" width="175" height="88" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
  <text x="752" y="228" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, monospace" font-size="13">Snowflake ...</text>
  <text x="752" y="252" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">vendor APIs</text>

  <rect x="120" y="310" width="680" height="78" rx="12" fill="rgba(139,92,246,0.15)" stroke="url(#violet)" stroke-width="1.5"/>
  <text x="460" y="342" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="14" font-weight="600">QueryFlux - one SQL front door</text>
  <text x="460" y="366" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">route, translate, queue, observe, guard</text>

  <text x="460" y="402" text-anchor="middle" fill="#ff7619" font-family="system-ui, sans-serif" font-size="11">Clients: BI, notebooks, agents, apps</text>
</svg>
