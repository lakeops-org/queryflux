<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Why the naive query is wrong: EU has five orders over two products. Summing stock over the joined rows counts product 10 twice and product 11 three times, giving 350. ossiec sums each product once, by primary key, giving 150.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fb923c"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
  </defs>

  <rect width="960" height="430" rx="20" fill="url(#bg)"/>
  <rect width="960" height="430" rx="20" fill="url(#glow)"/>
  <rect width="960" height="430" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="428" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="42" fill="#fafafa" font-size="18" font-weight="650">Five EU orders, two products, one stock number each</text>
    <text x="40" y="66" fill="#a1a1aa" font-size="12">Stock lives on products. Joining orders to products repeats a product once per order.</text>

    <!-- Joined rows -->
    <text x="40" y="104" fill="#d4d4d8" font-size="12" font-weight="600" letter-spacing="1">ORDERS ⋈ PRODUCTS  (region = EU)</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <!-- header -->
      <text x="56" y="132" fill="#71717a">order</text>
      <text x="150" y="132" fill="#71717a">product</text>
      <text x="270" y="132" fill="#71717a">stock</text>

      <rect x="40" y="142" width="300" height="34" rx="8" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.35)"/>
      <text x="56" y="164" fill="#e4e4e7">100</text><text x="150" y="164" fill="#c4b5fd">10</text><text x="270" y="164" fill="#e4e4e7">100</text>

      <rect x="40" y="182" width="300" height="34" rx="8" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.35)"/>
      <text x="56" y="204" fill="#e4e4e7">101</text><text x="150" y="204" fill="#7dd3fc">11</text><text x="270" y="204" fill="#e4e4e7">50</text>

      <rect x="40" y="222" width="300" height="34" rx="8" fill="rgba(167,139,250,0.10)" stroke="rgba(167,139,250,0.35)" stroke-dasharray="4 3"/>
      <text x="56" y="244" fill="#e4e4e7">102</text><text x="150" y="244" fill="#c4b5fd">10</text><text x="270" y="244" fill="#fb923c">100</text>
      <text x="318" y="244" fill="#fb923c" font-size="11">×2</text>

      <rect x="40" y="262" width="300" height="34" rx="8" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.35)" stroke-dasharray="4 3"/>
      <text x="56" y="284" fill="#e4e4e7">109</text><text x="150" y="284" fill="#7dd3fc">11</text><text x="270" y="284" fill="#fb923c">50</text>
      <text x="318" y="284" fill="#fb923c" font-size="11">×2</text>

      <rect x="40" y="302" width="300" height="34" rx="8" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.35)" stroke-dasharray="4 3"/>
      <text x="56" y="324" fill="#e4e4e7">110</text><text x="150" y="324" fill="#7dd3fc">11</text><text x="270" y="324" fill="#fb923c">50</text>
      <text x="318" y="324" fill="#fb923c" font-size="11">×3</text>
    </g>

    <!-- Naive path -->
    <path d="M352 238 C 420 238, 430 150, 498 150" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrO)"/>
    <rect x="500" y="104" width="420" height="104" rx="16" fill="rgba(255,118,25,0.08)" stroke="#ff7619" stroke-width="1.5"/>
    <text x="524" y="134" fill="#fdba74" font-size="13" font-weight="600">Agent's SQL: SUM(stock) over the joined rows</text>
    <text x="524" y="172" fill="#fed7aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">100 + 50 + 100 + 50 + 50</text>
    <text x="896" y="186" text-anchor="end" fill="#ff7619" font-size="34" font-weight="750">350</text>
    <text x="524" y="194" fill="#a16207" font-size="11">runs, looks plausible, wrong</text>

    <!-- ossiec path -->
    <path d="M352 238 C 420 238, 430 300, 498 300" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#arrG)"/>
    <rect x="500" y="244" width="420" height="120" rx="16" fill="rgba(134,239,172,0.07)" stroke="#86efac" stroke-width="1.5"/>
    <text x="524" y="274" fill="#bbf7d0" font-size="13" font-weight="600">ossiec: one row per product, by primary key</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect x="524" y="288" width="120" height="28" rx="7" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.4)"/>
      <text x="538" y="307" fill="#c4b5fd">10 → 100</text>
      <rect x="656" y="288" width="120" height="28" rx="7" fill="rgba(56,189,248,0.10)" stroke="rgba(56,189,248,0.4)"/>
      <text x="670" y="307" fill="#7dd3fc">11 → 50</text>
    </g>
    <text x="896" y="320" text-anchor="end" fill="#86efac" font-size="34" font-weight="750">150</text>
    <text x="524" y="346" fill="#4ade80" font-size="11" opacity="0.8">the same answer on all six engines in the test suite</text>

    <text x="40" y="392" fill="#71717a" font-size="11">Seed data from the ossiec test shop. US: 60 naive vs 30 correct (product 12 ordered twice).</text>
  </g>
</svg>
