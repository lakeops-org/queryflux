  <text x="80" y="27" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="12">routing.yaml</text>
  <text x="48" y="62" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">routers:</text>
<text x="62" y="82" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">  - type: queryRegex</text>
<text x="76" y="102" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">    rules:</text>
<text x="90" y="122" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">      - regex: "FROM local\\..*"</text>
<text x="104" y="142" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">        targetGroup:</text>
<text x="246" y="142" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"> duckdb-local</text>
<text x="62" y="162" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">  - type: protocolBased</text>
<text x="76" y="182" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">    trinoHttp:</text>
<text x="175.39999999999998" y="182" fill="#d4d4d8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13"> trino-default</text>
