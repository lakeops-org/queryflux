<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="80 runs per mode. As written: 33 right, 38 errors, 9 wrong answers. Translated without a catalog: 59 right, 3 with order lost, 5 errors, 13 wrong answers. Translated with schema: 65 right, 3 order lost, 5 errors, 7 wrong. Strict: 61 right, 3 order lost, 5 errors, 7 rejected, 4 wrong.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0614"/><stop offset="100%" stop-color="#050508"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/></pattern>
  </defs>
  <rect width="960" height="430" rx="20" fill="url(#bg)"/><rect width="960" height="430" rx="20" fill="url(#glow)"/><rect width="960" height="430" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="428" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>
