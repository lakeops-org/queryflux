<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Agent query path through QueryFlux">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
  </defs>
  <rect width="920" height="280" rx="16" fill="#0c0a12"/>
  <text x="460" y="36" text-anchor="middle" fill="#fafafa" font-family="system-ui, sans-serif" font-size="16" font-weight="600">One endpoint for agents, full control for operators</text>

  <g font-family="system-ui, sans-serif">
    <rect x="40" y="80" width="140" height="100" rx="12" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
    <text x="110" y="118" text-anchor="middle" fill="#ff7619" font-size="13" font-weight="600">Agent</text>
    <text x="110" y="142" text-anchor="middle" fill="#a1a1aa" font-size="11">MCP or SQL</text>
    <text x="110" y="162" text-anchor="middle" fill="#71717a" font-size="10">no warehouse keys</text>

    <line x1="180" y1="130" x2="248" y2="130" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="250" y="68" width="200" height="124" rx="12" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="350" y="104" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">QueryFlux</text>
    <text x="350" y="128" text-anchor="middle" fill="#a1a1aa" font-size="10">route ’ agents group</text>
    <text x="350" y="146" text-anchor="middle" fill="#a1a1aa" font-size="10">guardrails · queue · audit</text>
    <text x="350" y="164" text-anchor="middle" fill="#a1a1aa" font-size="10">impersonate caller</text>

    <line x1="450" y1="130" x2="518" y2="130" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="520" y="80" width="140" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <text x="590" y="118" text-anchor="middle" fill="#e4e4e7" font-size="13" font-weight="600">Trino</text>
    <text x="590" y="142" text-anchor="middle" fill="#a1a1aa" font-size="11">user permissions</text>
    <text x="590" y="162" text-anchor="middle" fill="#71717a" font-size="10">engine audit log</text>

    <rect x="700" y="80" width="180" height="100" rx="12" fill="rgba(163,230,53,0.06)" stroke="rgba(163,230,53,0.3)"/>
    <text x="790" y="118" text-anchor="middle" fill="#a3e635" font-size="13" font-weight="600">Studio</text>
    <text x="790" y="142" text-anchor="middle" fill="#a1a1aa" font-size="11">by agent &amp; session</text>
    <text x="790" y="162" text-anchor="middle" fill="#71717a" font-size="10">replay every query</text>

    <path d="M350 192 L350 228 L790 228 L790 180" fill="none" stroke="#52525b" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <text x="460" y="268" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Analyst dashboards use a separate cluster group with its own concurrency limit</text>
</svg>
