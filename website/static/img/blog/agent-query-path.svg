<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Agent query path through QueryFlux to Trino with Studio audit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="360" rx="20" fill="url(#bg)"/>
  <rect width="960" height="360" rx="20" fill="url(#glow)"/>
  <rect width="960" height="360" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="358" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="42" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">One endpoint for agents. Full control for operators.</text>
  <text x="40" y="66" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MCP or SQL in - route, guard, impersonate - engine + Studio history.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="110" width="160" height="140" rx="16" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
    <circle cx="120" cy="148" r="22" fill="rgba(255,118,25,0.2)" stroke="#ff7619"/>
    <circle cx="120" cy="142" r="7" fill="#fdba74"/>
    <path d="M104 162c4-10 28-10 32 0" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="196" text-anchor="middle" fill="#ffedd5" font-size="14" font-weight="650">Agent</text>
    <text x="120" y="218" text-anchor="middle" fill="#fdba74" font-size="11">MCP or SQL driver</text>
    <text x="120" y="238" text-anchor="middle" fill="#a16207" font-size="10">no warehouse keys</text>

    <line x1="200" y1="180" x2="248" y2="180" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="250" y="96" width="240" height="168" rx="16" fill="rgba(139,92,246,0.14)" stroke="#8b5cf6" stroke-width="1.75"/>
    <text x="370" y="128" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="650">QueryFlux</text>
    <rect x="274" y="144" width="192" height="28" rx="8" fill="rgba(0,0,0,0.25)"/>
    <text x="370" y="163" text-anchor="middle" fill="#c4b5fd" font-size="11">route to agents group</text>
    <rect x="274" y="180" width="192" height="28" rx="8" fill="rgba(0,0,0,0.25)"/>
    <text x="370" y="199" text-anchor="middle" fill="#c4b5fd" font-size="11">guardrails / queue / audit</text>
    <rect x="274" y="216" width="192" height="28" rx="8" fill="rgba(0,0,0,0.25)"/>
    <text x="370" y="235" text-anchor="middle" fill="#c4b5fd" font-size="11">impersonate caller</text>

    <line x1="490" y1="180" x2="538" y2="180" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="540" y="110" width="160" height="140" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)"/>
    <text x="620" y="160" text-anchor="middle" fill="#f4f4f5" font-size="15" font-weight="650">Trino</text>
    <text x="620" y="186" text-anchor="middle" fill="#a1a1aa" font-size="12">user permissions</text>
    <text x="620" y="210" text-anchor="middle" fill="#71717a" font-size="11">engine audit log</text>
    <text x="620" y="232" text-anchor="middle" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">EXECUTE AS</text>

    <rect x="740" y="110" width="180" height="140" rx="16" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.45)"/>
    <text x="830" y="160" text-anchor="middle" fill="#ecfccb" font-size="15" font-weight="650">Studio</text>
    <text x="830" y="186" text-anchor="middle" fill="#bef264" font-size="12">by agent and session</text>
    <text x="830" y="210" text-anchor="middle" fill="#86efac" font-size="11">replay every query</text>
    <text x="830" y="232" text-anchor="middle" fill="#4d7c0f" font-size="10" font-family="ui-monospace, Menlo, monospace">Conversations</text>

    <path d="M370 264 C370 300, 830 300, 830 250" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrG)" opacity="0.85"/>
    <text x="600" y="318" text-anchor="middle" fill="#86efac" font-size="11">query history streams to Studio</text>
  </g>

  <text x="480" y="346" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Analyst dashboards stay on a separate cluster group with its own concurrency limit.</text>
</svg>
