<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="QueryFlux two-stage routing pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff7619"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#bg)"/>
  <rect width="960" height="280" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="278" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="42" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">How a query is routed</text>
  <text x="40" y="66" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Group selection, then cluster selection, then dialect translation.</text>

  <line x1="100" y1="160" x2="860" y2="160" stroke="url(#pipe)" stroke-width="2" opacity="0.55" marker-end="url(#arr)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="110" width="130" height="100" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="68" cy="138" r="12" fill="rgba(139,92,246,0.25)" stroke="#c4b5fd"/>
    <text x="68" y="142" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="700">1</text>
    <text x="88" y="142" fill="#f4f4f5" font-size="13" font-weight="650">Query in</text>
    <text x="56" y="172" fill="#a1a1aa" font-size="11">Any frontend</text>
    <text x="56" y="190" fill="#71717a" font-size="10" font-family="ui-monospace, Menlo, monospace">SQL + context</text>

    <rect x="190" y="110" width="140" height="100" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <circle cx="218" cy="138" r="12" fill="rgba(139,92,246,0.35)" stroke="#c4b5fd"/>
    <text x="218" y="142" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="700">2</text>
    <text x="238" y="142" fill="#ede9fe" font-size="13" font-weight="650">Routers</text>
    <text x="206" y="172" fill="#c4b5fd" font-size="11">First match wins</text>
    <text x="206" y="190" fill="#a78bfa" font-size="10" font-family="ui-monospace, Menlo, monospace">regex / protocol / py</text>

    <rect x="350" y="110" width="140" height="100" rx="14" fill="rgba(139,92,246,0.08)" stroke="rgba(196,181,253,0.45)"/>
    <circle cx="378" cy="138" r="12" fill="rgba(139,92,246,0.25)" stroke="#c4b5fd"/>
    <text x="378" y="142" text-anchor="middle" fill="#e9d5ff" font-size="11" font-weight="700">3</text>
    <text x="398" y="142" fill="#f4f4f5" font-size="13" font-weight="650">Group</text>
    <text x="366" y="172" fill="#a1a1aa" font-size="11">Named pool</text>
    <text x="366" y="190" fill="#71717a" font-size="10" font-family="ui-monospace, Menlo, monospace">maxRunningQueries</text>

    <rect x="510" y="110" width="140" height="100" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="538" cy="138" r="12" fill="rgba(255,118,25,0.2)" stroke="#ff7619"/>
    <text x="538" y="142" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="700">4</text>
    <text x="558" y="142" fill="#f4f4f5" font-size="13" font-weight="650">Select</text>
    <text x="526" y="172" fill="#a1a1aa" font-size="11">Healthy cluster</text>
    <text x="526" y="190" fill="#71717a" font-size="10" font-family="ui-monospace, Menlo, monospace">RR / least-load</text>

    <rect x="670" y="110" width="130" height="100" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="698" cy="138" r="12" fill="rgba(163,230,53,0.18)" stroke="#a3e635"/>
    <text x="698" y="142" text-anchor="middle" fill="#d9f99d" font-size="11" font-weight="700">5</text>
    <text x="718" y="142" fill="#f4f4f5" font-size="13" font-weight="650">Translate</text>
    <text x="686" y="172" fill="#a1a1aa" font-size="11">sqlglot</text>
    <text x="686" y="190" fill="#71717a" font-size="10" font-family="ui-monospace, Menlo, monospace">if dialects differ</text>

    <rect x="820" y="110" width="100" height="100" rx="14" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <circle cx="848" cy="138" r="12" fill="rgba(163,230,53,0.25)" stroke="#a3e635"/>
    <text x="848" y="142" text-anchor="middle" fill="#d9f99d" font-size="11" font-weight="700">6</text>
    <text x="840" y="172" fill="#ecfccb" font-size="13" font-weight="650">Engine</text>
    <text x="836" y="192" fill="#86efac" font-size="10">execute</text>
  </g>

  <text x="480" y="250" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">If no cluster is free, the query waits in line - it is not dropped onto an overloaded backend.</text>
</svg>
