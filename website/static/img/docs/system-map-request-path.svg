<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="780" viewBox="0 0 560 780" role="img" aria-label="Query path from client through frontends, routing, translation, and engine adapter to persistence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="560" height="780" rx="20" fill="url(#bg)"/>
  <rect width="560" height="780" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="558" height="778" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">High-level query path</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Client protocol in; engine protocol out; async handles in persistence.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="80" y="88" width="400" height="56" rx="14" fill="rgba(139,92,246,0.35)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="280" y="112" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="650">Client</text>
    <text x="280" y="132" text-anchor="middle" fill="#e9d5ff" font-size="11">Trino CLI / psql / mysql / DBI</text>

    <line x1="280" y1="144" x2="280" y2="168" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="162" fill="#71717a" font-size="10">native protocol</text>

    <rect x="80" y="168" width="400" height="56" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="280" y="192" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Frontend Listener</text>
    <text x="280" y="212" text-anchor="middle" fill="#c4b5fd" font-size="10" font-style="italic">speaks the client&apos;s wire protocol</text>

    <line x1="280" y1="224" x2="280" y2="248" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="242" fill="#71717a" font-size="10">SQL + SessionContext</text>

    <rect x="80" y="248" width="400" height="56" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="280" y="272" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Router Chain</text>
    <text x="280" y="292" text-anchor="middle" fill="#c4b5fd" font-size="10" font-style="italic">selects target cluster group</text>

    <line x1="280" y1="304" x2="280" y2="328" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="322" fill="#71717a" font-size="10">ClusterGroupName</text>

    <rect x="80" y="328" width="400" height="56" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="280" y="352" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">ClusterGroupManager</text>
    <text x="280" y="372" text-anchor="middle" fill="#c4b5fd" font-size="10" font-style="italic">load-balances; queues if at capacity</text>

    <line x1="280" y1="384" x2="280" y2="408" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="402" fill="#71717a" font-size="10">ClusterName</text>

    <rect x="80" y="408" width="400" height="56" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="280" y="432" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Translation Service</text>
    <text x="280" y="452" text-anchor="middle" fill="#c4b5fd" font-size="10" font-style="italic">sqlglot via PyO3; skipped when dialects match</text>

    <line x1="280" y1="464" x2="280" y2="488" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="482" fill="#71717a" font-size="10">translated SQL</text>

    <rect x="80" y="488" width="400" height="56" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="280" y="512" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Engine Adapter</text>
    <text x="280" y="532" text-anchor="middle" fill="#c4b5fd" font-size="10" font-style="italic">speaks the backend engine&apos;s native protocol</text>

    <line x1="280" y1="544" x2="280" y2="580" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="568" fill="#71717a" font-size="10">QueryExecution (Async | Sync)</text>

    <ellipse cx="280" cy="620" rx="180" ry="40" fill="rgba(139,92,246,0.35)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="280" y="616" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="650">Persistence</text>
    <text x="280" y="634" text-anchor="middle" fill="#e9d5ff" font-size="10" font-style="italic">stores in-flight state for async engines</text>
  </g>
</svg>
