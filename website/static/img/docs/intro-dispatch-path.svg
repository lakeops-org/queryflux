<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="Dispatch path: client native protocol into QueryFlux frontends, router, SQL translation, cluster group, then Trino DuckDB and other engines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7619"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="320" rx="20" fill="url(#bg)"/>
  <rect width="960" height="320" rx="20" fill="url(#glow)"/>
  <rect width="960" height="320" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="318" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Dispatch and dialect translation</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Native protocol in. Route, translate if needed, pick a healthy cluster, then run.</text>

  <line x1="120" y1="170" x2="820" y2="170" stroke="url(#pipe)" stroke-width="2" opacity="0.4"/>

  <!-- Client -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="110" width="150" height="120" rx="16" fill="rgba(255,118,25,0.12)" stroke="#ff7619" stroke-width="1.5"/>
    <text x="115" y="150" text-anchor="middle" fill="#ffedd5" font-size="14" font-weight="650">Client</text>
    <text x="115" y="174" text-anchor="middle" fill="#fdba74" font-size="11">psql · Trino CLI</text>
    <text x="115" y="194" text-anchor="middle" fill="#fdba74" font-size="11">mysql · Snowflake</text>
    <text x="115" y="214" text-anchor="middle" fill="#a16207" font-size="10">BI tools</text>
  </g>

  <line x1="190" y1="170" x2="248" y2="170" stroke="#fdba74" stroke-width="1.75" marker-end="url(#arrO)"/>
  <text x="219" y="156" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">native</text>

  <!-- QueryFlux -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="260" y="96" width="320" height="148" rx="16" fill="rgba(139,92,246,0.14)" stroke="#8b5cf6" stroke-width="1.75"/>
    <text x="420" y="124" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="650">QueryFlux</text>

    <rect x="280" y="140" width="68" height="36" rx="8" fill="rgba(0,0,0,0.28)"/>
    <text x="314" y="162" text-anchor="middle" fill="#e9d5ff" font-size="11">Frontend</text>
    <line x1="348" y1="158" x2="362" y2="158" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="364" y="140" width="60" height="36" rx="8" fill="rgba(0,0,0,0.28)"/>
    <text x="394" y="162" text-anchor="middle" fill="#e9d5ff" font-size="11">Router</text>
    <line x1="424" y1="158" x2="438" y2="158" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="440" y="140" width="70" height="36" rx="8" fill="rgba(0,0,0,0.28)"/>
    <text x="475" y="162" text-anchor="middle" fill="#e9d5ff" font-size="11">Translate</text>
    <line x1="510" y1="158" x2="520" y2="158" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="522" y="140" width="42" height="36" rx="8" fill="rgba(0,0,0,0.28)"/>
    <text x="543" y="162" text-anchor="middle" fill="#e9d5ff" font-size="11">Group</text>

    <text x="420" y="210" text-anchor="middle" fill="#a78bfa" font-size="11">sqlglot when dialects differ · queue if at capacity</text>
  </g>

  <line x1="580" y1="170" x2="648" y2="170" stroke="#86efac" stroke-width="1.75" marker-end="url(#arrG)"/>
  <text x="614" y="156" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL</text>

  <!-- Engines -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="660" y="110" width="260" height="120" rx="16" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.5)" stroke-width="1.5"/>
    <text x="790" y="152" text-anchor="middle" fill="#ecfccb" font-size="15" font-weight="650">Query engines</text>
    <text x="790" y="178" text-anchor="middle" fill="#86efac" font-size="12">Trino · DuckDB · StarRocks</text>
    <text x="790" y="200" text-anchor="middle" fill="#4d7c0f" font-size="11">Athena · ADBC · …</text>
  </g>

  <text x="480" y="290" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Healthy cluster selection: round-robin, least-loaded, failover, or weighted.</text>
</svg>
