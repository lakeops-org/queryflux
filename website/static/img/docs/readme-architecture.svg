<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="QueryFlux: clients connect with native protocols; QueryFlux routes and translates SQL; engines execute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="55%" stop-color="#07050c"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glowL" cx="18%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ff7619" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7619" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="82%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7619"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="qfStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff7619"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="380" rx="22" fill="url(#bg)"/>
  <rect width="960" height="380" rx="22" fill="url(#glowL)"/>
  <rect width="960" height="380" rx="22" fill="url(#glowC)"/>
  <rect width="960" height="380" rx="22" fill="url(#glowR)"/>
  <rect width="960" height="380" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="378" rx="21" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <text x="48" y="48" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">One endpoint. Any engine.</text>
  <text x="48" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Native protocols in. Route, translate, and dispatch. Specialized engines underneath.</text>

  <line x1="160" y1="200" x2="800" y2="200" stroke="url(#pipe)" stroke-width="2.5" opacity="0.5"/>

  <!-- Clients -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="120" width="170" height="160" rx="18" fill="rgba(255,118,25,0.11)" stroke="#ff7619" stroke-width="1.75"/>
    <text x="125" y="158" text-anchor="middle" fill="#ffedd5" font-size="16" font-weight="700">Clients</text>
    <text x="125" y="186" text-anchor="middle" fill="#fdba74" font-size="12">Trino CLI · psql</text>
    <text x="125" y="208" text-anchor="middle" fill="#fdba74" font-size="12">mysql · Snowflake</text>
    <text x="125" y="230" text-anchor="middle" fill="#fdba74" font-size="12">Flight · MCP · BI</text>
    <text x="125" y="258" text-anchor="middle" fill="#a16207" font-size="11">native protocols</text>
  </g>

  <line x1="210" y1="200" x2="268" y2="200" stroke="#fdba74" stroke-width="2" marker-end="url(#arrO)"/>

  <!-- QueryFlux -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="280" y="110" width="300" height="180" rx="20" fill="rgba(139,92,246,0.15)" stroke="url(#qfStroke)" stroke-width="2"/>
    <text x="430" y="148" text-anchor="middle" fill="#f5f3ff" font-size="18" font-weight="700">QueryFlux</text>
    <text x="430" y="170" text-anchor="middle" fill="#c4b5fd" font-size="12">Rust proxy · control plane</text>

    <rect x="304" y="190" width="252" height="28" rx="8" fill="rgba(0,0,0,0.32)"/>
    <text x="430" y="209" text-anchor="middle" fill="#e9d5ff" font-size="12">Frontends · routing · queue</text>
    <rect x="304" y="228" width="252" height="28" rx="8" fill="rgba(0,0,0,0.32)"/>
    <text x="430" y="247" text-anchor="middle" fill="#e9d5ff" font-size="12">sqlglot dialect translation</text>
  </g>

  <line x1="580" y1="200" x2="638" y2="200" stroke="#86efac" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Engines -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="650" y="120" width="270" height="160" rx="18" fill="rgba(163,230,53,0.09)" stroke="rgba(163,230,53,0.55)" stroke-width="1.75"/>
    <text x="785" y="162" text-anchor="middle" fill="#ecfccb" font-size="16" font-weight="700">Engines</text>
    <text x="785" y="192" text-anchor="middle" fill="#86efac" font-size="12">Trino · DuckDB · StarRocks</text>
    <text x="785" y="214" text-anchor="middle" fill="#86efac" font-size="12">Athena · ClickHouse · ADBC</text>
    <text x="785" y="236" text-anchor="middle" fill="#4d7c0f" font-size="11">Snowflake · Databricks · …</text>
    <text x="785" y="262" text-anchor="middle" fill="#52525b" font-size="11" font-family="ui-monospace, Menlo, monospace">where the SQL runs</text>
  </g>

  <text x="480" y="340" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Capacity limits · guardrails · Studio · Prometheus — one surface for every engine.</text>
  <text x="480" y="362" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Open source · Apache 2.0 · queryflux.dev</text>
</svg>
