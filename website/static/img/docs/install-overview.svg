<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-label="Reference architecture: clients talk to QueryFlux; QueryFlux routes SQL to engines, persists to Postgres, and optionally connects Studio, Prometheus, identity, and policy engines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="55%" stop-color="#07050c"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ff7619" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff7619" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="48%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="78%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7619"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="qfStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ff7619"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.045)"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1080" height="560" rx="22" fill="url(#bg)"/>
  <rect width="1080" height="560" rx="22" fill="url(#glowL)"/>
  <rect width="1080" height="560" rx="22" fill="url(#glowC)"/>
  <rect width="1080" height="560" rx="22" fill="url(#glowR)"/>
  <rect width="1080" height="560" rx="22" fill="url(#dots)"/>
  <rect x="1" y="1" width="1078" height="558" rx="21" fill="none" stroke="rgba(255,255,255,0.09)"/>

  <!-- Header -->
  <text x="48" y="48" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Reference architecture</text>
  <text x="48" y="74" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">One QueryFlux binary in the middle. Clients and engines on the edges. Everything else is optional.</text>

  <!-- Primary flow spine -->
  <line x1="200" y1="230" x2="880" y2="230" stroke="url(#pipe)" stroke-width="2.5" opacity="0.55"/>

  <!-- Clients -->
  <g filter="url(#soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="150" width="160" height="160" rx="18" fill="rgba(255,118,25,0.10)" stroke="#ff7619" stroke-width="1.75"/>
    <circle cx="120" cy="196" r="24" fill="rgba(255,118,25,0.18)" stroke="#ff7619"/>
    <circle cx="120" cy="190" r="7" fill="#fdba74"/>
    <path d="M104 210c5-11 27-11 32 0" fill="none" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="246" text-anchor="middle" fill="#ffedd5" font-size="15" font-weight="700">Clients</text>
    <text x="120" y="268" text-anchor="middle" fill="#fdba74" font-size="11">BI · JDBC · psql</text>
    <text x="120" y="286" text-anchor="middle" fill="#a16207" font-size="11">mysql · MCP · agents</text>
  </g>

  <line x1="200" y1="230" x2="268" y2="230" stroke="#fdba74" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="234" y="216" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SQL in</text>

  <!-- QueryFlux centerpiece -->
  <g filter="url(#soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="280" y="120" width="320" height="220" rx="20" fill="rgba(139,92,246,0.14)" stroke="url(#qfStroke)" stroke-width="2"/>
    <text x="440" y="152" text-anchor="middle" fill="#f5f3ff" font-size="17" font-weight="700">QueryFlux server</text>
    <text x="440" y="172" text-anchor="middle" fill="#c4b5fd" font-size="11">one Rust binary · admin API :9000</text>

    <rect x="304" y="190" width="272" height="30" rx="9" fill="rgba(0,0,0,0.32)"/>
    <text x="440" y="210" text-anchor="middle" fill="#e9d5ff" font-size="12">1 · Frontends accept any protocol</text>
    <rect x="304" y="228" width="272" height="30" rx="9" fill="rgba(0,0,0,0.32)"/>
    <text x="440" y="248" text-anchor="middle" fill="#e9d5ff" font-size="12">2 · Route · queue · translate</text>
    <rect x="304" y="266" width="272" height="30" rx="9" fill="rgba(0,0,0,0.32)"/>
    <text x="440" y="286" text-anchor="middle" fill="#e9d5ff" font-size="12">3 · Dispatch with capacity limits</text>
  </g>

  <line x1="600" y1="230" x2="668" y2="230" stroke="#86efac" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="634" y="216" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SQL out</text>

  <!-- Engines -->
  <g filter="url(#soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="680" y="150" width="180" height="160" rx="18" fill="rgba(163,230,53,0.09)" stroke="rgba(163,230,53,0.55)" stroke-width="1.75"/>
    <text x="770" y="196" text-anchor="middle" fill="#ecfccb" font-size="15" font-weight="700">Query engines</text>
    <text x="770" y="222" text-anchor="middle" fill="#86efac" font-size="12">Trino · StarRocks</text>
    <text x="770" y="242" text-anchor="middle" fill="#86efac" font-size="12">DuckDB · Athena</text>
    <text x="770" y="262" text-anchor="middle" fill="#4d7c0f" font-size="11">ADBC warehouses</text>
    <text x="770" y="288" text-anchor="middle" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">where SQL runs</text>
  </g>

  <!-- Postgres -->
  <g filter="url(#soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <ellipse cx="960" cy="230" rx="78" ry="52" fill="rgba(255,118,25,0.12)" stroke="#ff7619" stroke-width="1.75"/>
    <text x="960" y="220" text-anchor="middle" fill="#ffedd5" font-size="14" font-weight="700">Postgres</text>
    <text x="960" y="242" text-anchor="middle" fill="#fdba74" font-size="11">config · history</text>
    <text x="960" y="258" text-anchor="middle" fill="#a16207" font-size="10">capacity · queue</text>
  </g>
  <line x1="860" y1="230" x2="880" y2="230" stroke="#fdba74" stroke-width="1.75" marker-end="url(#arrO)"/>
  <text x="870" y="214" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">persist</text>

  <!-- Optional rail label -->
  <text x="48" y="380" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650" letter-spacing="0.08em">OPTIONAL ADD-ONS</text>
  <line x1="180" y1="376" x2="1032" y2="376" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Optional cards - clean horizontal, no crossing -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- Studio -->
    <rect x="40" y="400" width="230" height="96" rx="16" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.4)"/>
    <text x="60" y="428" fill="#86efac" font-size="10" font-weight="700" letter-spacing="0.06em">UI</text>
    <text x="60" y="452" fill="#ecfccb" font-size="15" font-weight="700">Studio</text>
    <text x="60" y="474" fill="#a1a1aa" font-size="11">Clusters, routing, history</text>
    <text x="60" y="492" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">:3000 → admin :9000</text>

    <!-- Prometheus -->
    <rect x="290" y="400" width="230" height="96" rx="16" fill="rgba(255,118,25,0.08)" stroke="rgba(255,118,25,0.35)"/>
    <text x="310" y="428" fill="#fdba74" font-size="10" font-weight="700" letter-spacing="0.06em">METRICS</text>
    <text x="310" y="452" fill="#ffedd5" font-size="15" font-weight="700">Prometheus</text>
    <text x="310" y="474" fill="#a1a1aa" font-size="11">Scrapes /metrics + Grafana</text>
    <text x="310" y="492" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">admin :9000/metrics</text>

    <!-- Identity -->
    <rect x="540" y="400" width="230" height="96" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)"/>
    <text x="560" y="428" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="0.06em">AUTH</text>
    <text x="560" y="452" fill="#f4f4f5" font-size="15" font-weight="700">OIDC / LDAP</text>
    <text x="560" y="474" fill="#a1a1aa" font-size="11">Who the client is</text>
    <text x="560" y="492" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">or static users</text>

    <!-- Policy -->
    <rect x="790" y="400" width="242" height="96" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.14)"/>
    <text x="810" y="428" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="0.06em">POLICY</text>
    <text x="810" y="452" fill="#f4f4f5" font-size="15" font-weight="700">OPA / Cerbos</text>
    <text x="810" y="474" fill="#a1a1aa" font-size="11">Allow, deny, row filters, masks</text>
    <text x="810" y="492" fill="#52525b" font-size="10" font-family="ui-monospace, Menlo, monospace">evaluated per query</text>
  </g>

  <!-- Subtle connectors from optional rail up to QF without clutter: short ticks only -->
  <path d="M155 400 V350" fill="none" stroke="rgba(134,239,172,0.35)" stroke-width="1.25" stroke-dasharray="3 4"/>
  <path d="M405 400 V350" fill="none" stroke="rgba(253,186,116,0.35)" stroke-width="1.25" stroke-dasharray="3 4"/>
  <path d="M655 400 V350" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="1.25" stroke-dasharray="3 4"/>
  <path d="M910 400 V350" fill="none" stroke="rgba(167,139,250,0.35)" stroke-width="1.25" stroke-dasharray="3 4"/>
  <path d="M155 350 H910" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M440 340 V350" fill="none" stroke="rgba(167,139,250,0.45)" stroke-width="1.25" stroke-dasharray="3 4"/>

  <text x="540" y="540" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Required path is Clients → QueryFlux → Engines. Postgres for production. Studio, metrics, identity, and policy plug in when you need them.</text>
</svg>
