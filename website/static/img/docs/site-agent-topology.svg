<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Site agent topology: workers talk to a site agent and query engines; agent opens outbound connections to the control plane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="960" height="480" rx="20" fill="url(#bg)"/>
  <rect width="960" height="480" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="478" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="38" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Site agent topology</text>
  <text x="40" y="58" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">One outbound-only agent per site. Workers use the same worker API; nothing connects into the site.</text>

  <rect x="32" y="78" width="520" height="360" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)"/>
  <text x="48" y="102" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Site (LAN)</text>

  <line x1="580" y1="90" x2="580" y2="420" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="590" y="102" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Upstream (WAN)</text>

  <rect x="52" y="128" width="100" height="44" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="102" y="155" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Worker</text>
  <rect x="52" y="184" width="100" height="44" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="102" y="211" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Worker</text>
  <rect x="52" y="240" width="100" height="44" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="102" y="267" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Worker</text>

  <line x1="152" y1="150" x2="198" y2="210" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="152" y1="206" x2="198" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="152" y1="262" x2="198" y2="230" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="168" y="188" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">/worker/*</text>

  <rect x="210" y="150" width="220" height="200" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="320" y="178" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Site agent</text>
  <text x="320" y="198" text-anchor="middle" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">same worker API</text>
  <rect x="228" y="214" width="184" height="28" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="320" y="233" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">snapshot cache (disk)</text>
  <rect x="228" y="250" width="184" height="28" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="320" y="269" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">fleet registry (memory)</text>
  <rect x="228" y="286" width="184" height="28" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="320" y="305" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">history spool (disk)</text>

  <line x1="102" y1="284" x2="102" y2="348" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="120" y="340" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL</text>
  <rect x="52" y="360" width="200" height="56" rx="12" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.45)"/>
  <text x="152" y="384" text-anchor="middle" fill="#ecfccb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Query engines</text>
  <text x="152" y="404" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Trino · DuckDB · StarRocks · …</text>

  <line x1="430" y1="200" x2="618" y2="160" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="250" x2="618" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="300" x2="618" y2="280" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="330" x2="618" y2="340" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="148" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">config long-poll</text>
  <text x="520" y="208" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">POST /worker/fleet</text>
  <text x="500" y="268" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">POST query-records</text>
  <text x="500" y="328" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">/worker/capacity/*</text>

  <rect x="630" y="140" width="290" height="240" rx="14" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="775" y="172" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Control plane</text>
  <rect x="650" y="192" width="250" height="36" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="775" y="215" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">/worker/config/wait</text>
  <rect x="650" y="240" width="250" height="36" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="775" y="263" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">/worker/fleet</text>
  <rect x="650" y="288" width="250" height="36" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="775" y="311" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">/worker/query-records</text>
  <rect x="650" y="336" width="250" height="28" rx="8" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.1)"/>
  <text x="775" y="355" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">/worker/capacity/*</text>

  <ellipse cx="775" cy="420" rx="80" ry="28" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
  <text x="775" y="425" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Postgres</text>
  <line x1="775" y1="380" x2="775" y2="390" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>

  <text x="480" y="462" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Workers cannot tell: the agent serves the exact worker API. Query engines stay on the site LAN.</text>

</svg>
