<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Worker mode roles: control plane with Postgres, sidecar and pooled workers talking to engines, never connecting to Postgres">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="520" rx="20" fill="url(#bg)"/>
  <rect width="960" height="520" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="518" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Roles and topology</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Control plane owns shared state. Workers serve queries next to apps and never touch Postgres.</text>

  <!-- Control plane -->
  <rect x="240" y="84" width="360" height="100" rx="16" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="110" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Control plane</text>
  <rect x="260" y="124" width="150" height="40" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.12)"/>
  <text x="335" y="149" text-anchor="middle" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Admin API + Studio</text>
  <rect x="430" y="124" width="150" height="40" rx="10" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.12)"/>
  <text x="505" y="142" text-anchor="middle" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Worker API</text>
  <text x="505" y="158" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">/worker/*</text>

  <!-- Postgres -->
  <ellipse cx="760" cy="134" rx="90" ry="42" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
  <text x="760" y="128" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Postgres</text>
  <text x="760" y="148" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">config · leases · history · registry</text>
  <line x1="600" y1="134" x2="668" y2="134" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- Fleet -->
  <rect x="40" y="220" width="600" height="200" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="56" y="246" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Workers — never connect to Postgres</text>

  <!-- App pod sidecar -->
  <rect x="60" y="266" width="250" height="130" rx="12" fill="rgba(255,118,25,0.08)" stroke="rgba(255,118,25,0.4)"/>
  <text x="185" y="290" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Application pod</text>
  <rect x="80" y="308" width="90" height="64" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.12)"/>
  <text x="125" y="345" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">App</text>
  <rect x="200" y="308" width="90" height="64" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="245" y="336" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Worker</text>
  <text x="245" y="354" text-anchor="middle" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">sidecar</text>
  <line x1="170" y1="340" x2="198" y2="340" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="184" y="330" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">localhost</text>

  <!-- Shared pool -->
  <rect x="340" y="266" width="280" height="130" rx="12" fill="rgba(139,92,246,0.08)" stroke="rgba(167,139,250,0.4)"/>
  <text x="480" y="290" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Shared worker pool</text>
  <rect x="360" y="308" width="100" height="64" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="410" y="345" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Worker</text>
  <rect x="500" y="308" width="100" height="64" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
  <text x="550" y="345" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Worker</text>
  <line x1="460" y1="340" x2="498" y2="340" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="480" y="328" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">peer bootstrap</text>

  <!-- Apps to pool -->
  <rect x="380" y="450" width="80" height="36" rx="10" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
  <text x="420" y="472" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">Apps</text>
  <line x1="420" y1="450" x2="420" y2="400" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>
  <text x="432" y="430" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Service · ClientIP affinity</text>

  <!-- Fleet to Worker API -->
  <path d="M640 300 C700 300, 720 220, 505 184" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="250" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">config long-poll · heartbeat</text>
  <text x="680" y="266" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">capacity leases · query history</text>

  <!-- Engines -->
  <ellipse cx="820" cy="320" rx="100" ry="48" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.45)" stroke-width="1.5"/>
  <text x="820" y="314" text-anchor="middle" fill="#ecfccb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Engines</text>
  <text x="820" y="334" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Trino · DuckDB · StarRocks · …</text>
  <line x1="640" y1="340" x2="718" y2="330" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="670" y="360" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL</text>
</svg>
