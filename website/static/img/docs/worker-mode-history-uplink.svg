<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" role="img" aria-label="Query history uplink: worker posts records to the control plane or a named history endpoint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="860" height="160" rx="20" fill="url(#bg)"/>
  <rect width="860" height="160" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="858" height="158" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="32" y="36" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650">Query history uplink</text>
  <text x="32" y="56" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Workers keep no durable history. Finished records go upstream in batches.</text>

  <rect x="32" y="80" width="110" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
  <text x="87" y="111" text-anchor="middle" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Worker</text>

  <line x1="142" y1="96" x2="210" y2="96" stroke="#a78bfa" stroke-width="1.75" marker-end="url(#arr)"/>
  <line x1="142" y1="116" x2="210" y2="116" stroke="#a78bfa" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <rect x="220" y="68" width="280" height="36" rx="10" fill="rgba(139,92,246,0.14)" stroke="#8b5cf6"/>
  <text x="360" y="91" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Control plane (default)</text>

  <rect x="220" y="112" width="280" height="36" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.14)"/>
  <text x="360" y="135" text-anchor="middle" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">History endpoint (optional)</text>

  <text x="520" y="91" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="10">POST /worker/query-records</text>
  <text x="520" y="135" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="10">workerApi.history.endpoint</text>
</svg>
