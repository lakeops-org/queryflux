<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="Health loop: custom healthCheckQuery or adapter health_check, then update is_healthy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="520" height="340" rx="20" fill="url(#bg)"/>
  <rect width="520" height="340" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="518" height="338" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Health loop (every 30s)</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Failed probes exclude the cluster from routing until the next success.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="180" y="88" width="160" height="44" rx="12" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="260" y="116" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Health loop</text>

    <line x1="260" y1="132" x2="260" y2="156" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

    <polygon points="260,156 320,196 260,236 200,196" fill="rgba(255,118,25,0.12)" stroke="#ff7619" stroke-width="1.5"/>
    <text x="260" y="192" text-anchor="middle" fill="#ffedd5" font-size="10" font-weight="650">Custom</text>
    <text x="260" y="206" text-anchor="middle" fill="#fdba74" font-size="10">healthCheckQuery?</text>

    <line x1="200" y1="196" x2="120" y2="196" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="168" y="188" text-anchor="middle" fill="#86efac" font-size="10">yes</text>

    <rect x="20" y="172" width="100" height="48" rx="10" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="70" y="192" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="ui-monospace, Menlo, monospace">execute_custom</text>
    <text x="70" y="206" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="ui-monospace, Menlo, monospace">_health_check</text>

    <line x1="320" y1="196" x2="400" y2="196" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="352" y="188" fill="#71717a" font-size="10">no</text>

    <rect x="400" y="172" width="100" height="48" rx="10" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="450" y="192" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="ui-monospace, Menlo, monospace">adapter.</text>
    <text x="450" y="206" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="ui-monospace, Menlo, monospace">health_check</text>

    <line x1="70" y1="220" x2="70" y2="268" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="450" y1="220" x2="450" y2="268" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="70" y1="268" x2="450" y2="268" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="260" y1="268" x2="260" y2="288" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="160" y="288" width="200" height="44" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="260" y="316" text-anchor="middle" fill="#86efac" font-size="13" font-weight="650">Update is_healthy</text>
  </g>
</svg>
