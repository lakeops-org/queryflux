<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Multi-replica topology: clients through a load balancer to QueryFlux replicas that share Postgres and talk to query engines">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="960" height="440" rx="20" fill="url(#bg)"/>
  <rect width="960" height="440" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="438" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Coordinated multi-replica</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Replicas share one Postgres for capacity leases, queue claims, config, and history.</text>

  <rect x="40" y="180" width="120" height="80" rx="14" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
  <text x="100" y="216" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Clients</text>
  <text x="100" y="238" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">BI · JDBC · CLI</text>

  <line x1="160" y1="220" x2="208" y2="220" stroke="#fdba74" stroke-width="1.75" marker-end="url(#arrO)"/>

  <rect x="220" y="190" width="100" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.16)"/>
  <text x="270" y="218" text-anchor="middle" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">LB</text>
  <text x="270" y="236" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">sticky if needed</text>

  <line x1="320" y1="210" x2="368" y2="160" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="220" x2="368" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="230" x2="368" y2="280" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="380" y="100" width="200" height="56" rx="12" fill="rgba(139,92,246,0.16)" stroke="#8b5cf6"/>
  <text x="480" y="126" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">QueryFlux replica</text>
  <text x="480" y="146" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">instance ID</text>
  <rect x="380" y="192" width="200" height="56" rx="12" fill="rgba(139,92,246,0.16)" stroke="#8b5cf6"/>
  <text x="480" y="218" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">QueryFlux replica</text>
  <text x="480" y="238" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">instance ID</text>
  <rect x="380" y="284" width="200" height="56" rx="12" fill="rgba(139,92,246,0.16)" stroke="#8b5cf6"/>
  <text x="480" y="310" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">QueryFlux replica</text>
  <text x="480" y="330" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, monospace" font-size="10">instance ID</text>

  <ellipse cx="720" cy="128" rx="100" ry="40" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
  <text x="720" y="122" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Postgres</text>
  <text x="720" y="142" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">leases · queue · config · history</text>

  <line x1="580" y1="128" x2="618" y2="128" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="580" y1="210" x2="640" y2="150" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>
  <line x1="580" y1="300" x2="640" y2="160" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>

  <rect x="620" y="240" width="300" height="100" rx="14" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.5)" stroke-width="1.5"/>
  <text x="770" y="280" text-anchor="middle" fill="#ecfccb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Query engines</text>
  <text x="770" y="304" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Trino · DuckDB · StarRocks · …</text>
  <text x="770" y="324" text-anchor="middle" fill="#4d7c0f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL from whichever replica owns the query</text>

  <line x1="580" y1="220" x2="618" y2="280" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="580" y1="312" x2="618" y2="300" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="600" y="250" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL</text>

  <text x="480" y="400" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Never scale replicas on inMemory persistence — capacity and history would diverge per pod.</text>
  <text x="480" y="420" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">maxRunningQueries is fleet-wide via capacity leases. Fail-closed when coordination is down.</text>

</svg>
