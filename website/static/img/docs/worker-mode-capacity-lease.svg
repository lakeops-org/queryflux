<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Capacity lease sequence: client query acquires a lease via the control plane before executing on the engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="440" rx="20" fill="url(#bg)"/>
  <rect width="960" height="440" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="438" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Shared capacity leases</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">One maxRunningQueries across the control plane and every worker.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="88" width="120" height="36" rx="10" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
    <text x="100" y="111" text-anchor="middle" fill="#ffedd5" font-size="13" font-weight="650">Client</text>
    <rect x="260" y="88" width="120" height="36" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="320" y="111" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Worker</text>
    <rect x="500" y="88" width="160" height="36" rx="10" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="580" y="111" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="650">Control plane</text>
    <rect x="780" y="88" width="120" height="36" rx="10" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="840" y="111" text-anchor="middle" fill="#ecfccb" font-size="13" font-weight="650">Engine</text>
  </g>

  <line x1="100" y1="124" x2="100" y2="410" stroke="rgba(253,186,116,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="124" x2="320" y2="410" stroke="rgba(167,139,250,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="580" y1="124" x2="580" y2="410" stroke="rgba(167,139,250,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="840" y1="124" x2="840" y2="410" stroke="rgba(134,239,172,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <line x1="100" y1="160" x2="312" y2="160" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="200" y="152" text-anchor="middle" fill="#fdba74">query</text>

    <rect x="250" y="176" width="140" height="24" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)"/>
    <text x="320" y="192" text-anchor="middle" fill="#71717a" font-size="11">local slot free</text>

    <line x1="320" y1="220" x2="572" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="440" y="212" text-anchor="middle" fill="#d4d4d8">POST /worker/capacity/acquire</text>

    <!-- alt granted -->
    <rect x="300" y="240" width="560" height="90" rx="10" fill="rgba(163,230,53,0.05)" stroke="rgba(163,230,53,0.25)"/>
    <text x="320" y="258" fill="#86efac" font-size="11" font-weight="650">granted</text>
    <line x1="580" y1="270" x2="328" y2="270" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="450" y="262" text-anchor="middle" fill="#86efac">granted: true</text>
    <line x1="320" y1="300" x2="832" y2="300" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="560" y="292" text-anchor="middle" fill="#d4d4d8">execute</text>
    <line x1="320" y1="320" x2="572" y2="320" stroke="#a78bfa" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="440" y="336" text-anchor="middle" fill="#71717a" font-size="11">POST release-batch (queued)</text>

    <!-- alt fleet full -->
    <rect x="300" y="360" width="340" height="60" rx="10" fill="rgba(251,113,133,0.06)" stroke="rgba(251,113,133,0.25)"/>
    <text x="320" y="378" fill="#fb7185" font-size="11" font-weight="650">fleet full</text>
    <line x1="580" y1="392" x2="328" y2="392" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="450" y="384" text-anchor="middle" fill="#fda4af">granted: false</text>
    <text x="450" y="412" text-anchor="middle" fill="#71717a" font-size="11">queue · retry with backoff</text>
  </g>
</svg>
