<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="minimal-trino quickstart: Trino CLI through QueryFlux to Trino, Postgres persistence, Studio admin API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="820" height="260" rx="20" fill="url(#bg)"/>
  <rect width="820" height="260" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="818" height="258" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Route your first query</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">examples/minimal-trino Docker Compose stack.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="110" width="110" height="56" rx="12" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
    <text x="95" y="134" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Trino CLI</text>
    <text x="95" y="152" text-anchor="middle" fill="#fdba74" font-size="10">or curl</text>

    <rect x="220" y="100" width="120" height="76" rx="14" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="280" y="132" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="650">QueryFlux</text>
    <text x="280" y="152" text-anchor="middle" fill="#a78bfa" font-size="10">Trino HTTP :8080</text>

    <rect x="410" y="110" width="100" height="56" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="460" y="134" text-anchor="middle" fill="#ecfccb" font-size="13" font-weight="650">Trino</text>
    <text x="460" y="152" text-anchor="middle" fill="#86efac" font-size="10">direct :8081</text>

    <ellipse cx="620" cy="138" rx="72" ry="32" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
    <text x="620" y="134" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Postgres</text>
    <text x="620" y="150" text-anchor="middle" fill="#fdba74" font-size="9">history, config :5433</text>

    <rect x="40" y="200" width="88" height="44" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="84" y="220" text-anchor="middle" fill="#ecfccb" font-size="12" font-weight="650">Studio</text>
    <text x="84" y="236" text-anchor="middle" fill="#86efac" font-size="10">:3000</text>

    <line x1="150" y1="138" x2="218" y2="138" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="340" y1="138" x2="408" y2="138" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="340" y1="160" x2="548" y2="160" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="128" y1="222" x2="248" y2="176" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrG)"/>
    <text x="168" y="200" fill="#71717a" font-size="10">Admin API :9000</text>
  </g>
</svg>
