<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="Prometheus and Grafana quickstart: scrape QueryFlux metrics and visualize with PromQL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="820" height="280" rx="20" fill="url(#bg)"/>
  <rect width="820" height="280" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="818" height="278" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Prometheus and Grafana</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">examples/with-prometheus-grafana stack.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="40" y="110" width="120" height="48" rx="12" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
    <text x="100" y="130" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="650">Trino CLI / HTTP</text>
    <text x="100" y="148" text-anchor="middle" fill="#fdba74" font-size="10">:8080</text>

    <rect x="220" y="100" width="120" height="68" rx="14" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="280" y="132" text-anchor="middle" fill="#ede9fe" font-size="14" font-weight="650">QueryFlux</text>
    <text x="280" y="152" text-anchor="middle" fill="#a78bfa" font-size="10">/metrics :9000</text>

    <rect x="400" y="110" width="88" height="48" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="444" y="138" text-anchor="middle" fill="#ecfccb" font-size="13" font-weight="650">Trino</text>

    <ellipse cx="560" cy="134" rx="64" ry="28" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
    <text x="560" y="138" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Postgres</text>

    <rect x="40" y="200" width="120" height="48" rx="12" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
    <text x="100" y="220" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Prometheus</text>
    <text x="100" y="236" text-anchor="middle" fill="#fdba74" font-size="10">:9090</text>

    <rect x="220" y="200" width="100" height="48" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="270" y="228" text-anchor="middle" fill="#ecfccb" font-size="13" font-weight="650">Grafana</text>
    <text x="270" y="244" text-anchor="middle" fill="#86efac" font-size="10">:3000</text>

    <line x1="160" y1="134" x2="218" y2="134" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="340" y1="134" x2="398" y2="134" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="280" y1="168" x2="496" y2="150" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="160" y1="224" x2="218" y2="160" stroke="#71717a" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="168" y="188" fill="#71717a" font-size="9">scrape every 15s</text>
    <line x1="160" y1="224" x2="218" y2="224" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="188" y="216" fill="#71717a" font-size="10">PromQL</text>
  </g>
</svg>
