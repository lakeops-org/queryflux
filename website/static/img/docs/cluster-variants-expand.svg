<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="Config load: Postgres cluster configs expand into AdbcAdapter instances and LiveConfig maps">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="820" height="220" rx="20" fill="url(#bg)"/>
  <rect width="820" height="220" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="818" height="218" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Config load</text>
  <text x="40" y="64" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Persisted cluster rows expand into runtime adapters and live routing state.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <ellipse cx="120" cy="140" rx="88" ry="36" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
    <text x="120" y="136" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Postgres</text>
    <text x="120" y="154" text-anchor="middle" fill="#fdba74" font-size="10" font-family="ui-monospace, Menlo, monospace">cluster_configs</text>

    <rect x="260" y="112" width="180" height="56" rx="14" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="350" y="136" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="650">expand_cluster</text>
    <text x="350" y="154" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="650">_variants</text>

    <rect x="520" y="100" width="130" height="48" rx="12" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6"/>
    <text x="585" y="122" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="650">Build</text>
    <text x="585" y="138" text-anchor="middle" fill="#c4b5fd" font-size="11">AdbcAdapter</text>

    <rect x="520" y="158" width="130" height="48" rx="12" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="585" y="180" text-anchor="middle" fill="#ecfccb" font-size="12" font-weight="650">LiveConfig</text>
    <text x="585" y="196" text-anchor="middle" fill="#86efac" font-size="11">maps</text>

    <line x1="208" y1="140" x2="258" y2="140" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="440" y1="128" x2="518" y2="124" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="440" y1="152" x2="518" y2="182" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>
</svg>
