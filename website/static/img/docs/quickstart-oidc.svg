<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Keycloak OIDC quickstart: client gets a token from Keycloak, sends Bearer JWT to QueryFlux, which verifies JWKS and proxies SQL to Trino; history goes to Postgres">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fdba74"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="960" height="420" rx="20" fill="url(#bg)"/>
  <rect width="960" height="420" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="418" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Secure with Keycloak (OIDC)</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">examples/with-keycloak-oidc — password grant, then Bearer JWT on Trino HTTP.</text>

  <!-- Client -->
  <rect x="40" y="180" width="140" height="80" rx="14" fill="rgba(255,118,25,0.12)" stroke="#ff7619" stroke-width="1.5"/>
  <text x="110" y="214" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">curl / SQL</text>
  <text x="110" y="236" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">client</text>

  <!-- Keycloak (top lane) -->
  <rect x="360" y="90" width="180" height="72" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <text x="450" y="120" text-anchor="middle" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Keycloak</text>
  <text x="450" y="142" text-anchor="middle" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">realm: queryflux · :8180</text>

  <!-- 1. password grant: client up to Keycloak -->
  <path d="M180 200 C240 200, 280 126, 358 126" fill="none" stroke="#fdba74" stroke-width="1.75" marker-end="url(#arrO)"/>
  <text x="240" y="150" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">1. password grant</text>

  <!-- QueryFlux -->
  <rect x="320" y="180" width="200" height="80" rx="14" fill="rgba(139,92,246,0.16)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="212" text-anchor="middle" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">QueryFlux</text>
  <text x="420" y="234" text-anchor="middle" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Trino HTTP · :8080</text>

  <!-- 2. Bearer JWT: client to QueryFlux -->
  <line x1="180" y1="220" x2="318" y2="220" stroke="#fdba74" stroke-width="1.75" marker-end="url(#arrO)"/>
  <text x="250" y="210" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">2. Bearer JWT</text>

  <!-- JWKS verify: QueryFlux up to Keycloak (dashed) -->
  <line x1="420" y1="180" x2="420" y2="164" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="432" y="176" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">verify JWKS</text>

  <!-- Trino (engine, separate) -->
  <rect x="620" y="180" width="140" height="80" rx="14" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.5)" stroke-width="1.5"/>
  <text x="690" y="212" text-anchor="middle" fill="#ecfccb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Trino</text>
  <text x="690" y="234" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">direct · :8081</text>

  <line x1="520" y1="220" x2="618" y2="220" stroke="#86efac" stroke-width="1.75" marker-end="url(#arrG)"/>
  <text x="570" y="208" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SQL</text>
  <text x="570" y="246" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">queryAuth: passthrough</text>

  <!-- Postgres history -->
  <ellipse cx="420" cy="340" rx="90" ry="36" fill="rgba(255,118,25,0.1)" stroke="#ff7619" stroke-width="1.5"/>
  <text x="420" y="336" text-anchor="middle" fill="#ffedd5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Postgres</text>
  <text x="420" y="354" text-anchor="middle" fill="#fdba74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">query history</text>
  <line x1="420" y1="260" x2="420" y2="302" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arrO)"/>

  <text x="480" y="400" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Get a token from Keycloak, call QueryFlux with it; QueryFlux verifies the JWT and proxies SQL to Trino.</text>

</svg>
