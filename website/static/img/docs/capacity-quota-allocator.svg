<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Capacity quotas: holders report demand; allocator writes grants; admit without I/O within grant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0614"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="960" height="500" rx="20" fill="url(#bg)"/>
  <rect width="960" height="500" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="958" height="498" rx="19" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <text x="40" y="40" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Capacity quotas</text>
  <text x="40" y="62" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Holders report demand; one replica runs the allocator; admit locally while running &lt; grant.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
    <rect x="40" y="88" width="120" height="44" rx="10" fill="rgba(255,118,25,0.12)" stroke="#ff7619"/>
    <text x="100" y="108" text-anchor="middle" fill="#ffedd5" font-size="11" font-weight="650">Holder</text>
    <text x="100" y="124" text-anchor="middle" fill="#fdba74" font-size="9">worker or replica</text>

    <rect x="280" y="88" width="120" height="44" rx="10" fill="rgba(139,92,246,0.18)" stroke="#8b5cf6"/>
    <text x="340" y="115" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="650">Control plane</text>

    <rect x="520" y="88" width="100" height="44" rx="10" fill="rgba(255,118,25,0.1)" stroke="#ff7619"/>
    <text x="570" y="115" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="650">Postgres</text>

    <rect x="720" y="88" width="120" height="44" rx="10" fill="rgba(163,230,53,0.1)" stroke="rgba(163,230,53,0.45)"/>
    <text x="780" y="108" text-anchor="middle" fill="#ecfccb" font-size="11" font-weight="650">Allocator</text>
    <text x="780" y="124" text-anchor="middle" fill="#86efac" font-size="9">one replica</text>
  </g>

  <line x1="100" y1="132" x2="100" y2="460" stroke="rgba(253,186,116,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="340" y1="132" x2="340" y2="460" stroke="rgba(167,139,250,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="570" y1="132" x2="570" y2="460" stroke="rgba(253,186,116,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="780" y1="132" x2="780" y2="460" stroke="rgba(134,239,172,0.35)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="40" y="148" width="880" height="120" rx="12" fill="rgba(139,92,246,0.06)" stroke="rgba(139,92,246,0.25)"/>
  <text x="56" y="168" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">loop every 1s (250 ms while queries wait)</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <line x1="100" y1="200" x2="332" y2="200" stroke="#fdba74" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="210" y="192" text-anchor="middle" fill="#d4d4d8">POST /worker/capacity/quota</text>
    <line x1="340" y1="220" x2="562" y2="220" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="450" y="212" text-anchor="middle" fill="#71717a">upsert capacity_holders</text>
    <line x1="570" y1="240" x2="108" y2="240" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="340" y="232" text-anchor="middle" fill="#86efac">current grant and sequence</text>
  </g>

  <rect x="40" y="288" width="880" height="100" rx="12" fill="rgba(163,230,53,0.05)" stroke="rgba(163,230,53,0.25)"/>
  <text x="56" y="308" fill="#86efac" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">loop every 200 ms</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">
    <line x1="780" y1="330" x2="578" y2="330" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="680" y="322" text-anchor="middle" fill="#d4d4d8">lock clusters, read demand and leases</text>
    <rect x="720" y="342" width="120" height="28" rx="6" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.08)"/>
    <text x="780" y="360" text-anchor="middle" fill="#c4b5fd">fair share, headroom, shrink</text>
    <line x1="780" y1="372" x2="578" y2="372" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="680" y="364" text-anchor="middle" fill="#71717a">write grants, quota_committed</text>
  </g>

  <rect x="40" y="408" width="880" height="72" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)"/>
  <text x="56" y="432" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="650">Note</text>
  <text x="56" y="452" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Admit while running &lt; grant (no I/O). Beyond the grant: one per-query lease (the reserve).</text>
  <text x="56" y="470" fill="#71717a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Per-query acquire checks leased + quota_committed &lt; max.</text>
</svg>
