# Cerbos + Lakekeeper/MinIO + Trino for the QueryFlux data-access-control demo.
#
# QueryFlux runs on the host from this branch (ghcr.io ... :latest does not
# include accessControl yet). See README.md.
#
#   docker compose up -d --wait
#   docker compose --profile seed run --rm data-seed   # if tables are missing
#
# Cerbos:      http://127.0.0.1:8184  (HTTP; gRPC on 8185, unused by QueryFlux)
# Lakekeeper:  http://127.0.0.1:8181
# Trino:       http://127.0.0.1:8081  (QueryFlux backend; SQL via QueryFlux :8080)
# QueryFlux PG: postgresql://queryflux:queryflux@127.0.0.1:5434/queryflux (host :5434)

name: queryflux-example-with-cerbos

services:
  queryflux-db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: queryflux
      POSTGRES_USER: queryflux
      POSTGRES_PASSWORD: queryflux
    volumes:
      - queryflux-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryflux -d queryflux"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    ports:
      - "127.0.0.1:8184:3592"
      - "127.0.0.1:8185:3593"
    volumes:
      - ./policy:/policies:ro
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--kind=http"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  trino:
    # Pinned to match data-seed's client below — CATALOG_MANAGEMENT=dynamic syntax can
    # change incompatibly between Trino releases, so client and server must stay in sync.
    image: trinodb/trino:476
    environment:
      - CATALOG_MANAGEMENT=dynamic
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  lakekeeper-db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - lakekeeper-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  minio:
    image: quay.io/minio/minio
    environment:
      - MINIO_ROOT_USER=minio-root-user
      - MINIO_ROOT_PASSWORD=minio-root-password
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 10s
      retries: 20
      start_period: 15s

  createbuckets:
    image: quay.io/minio/minio
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minio-root-user minio-root-password;
      /usr/bin/mc mb --ignore-existing local/warehouse;
      exit 0;
      "

  migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=dev-key-not-secure
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
    restart: "no"
    command: ["migrate"]
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    pull_policy: always
    environment:
      - LAKEKEEPER__PG_ENCRYPTION_KEY=dev-key-not-secure
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@lakekeeper-db:5432/postgres
    command: ["serve"]
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  bootstrap:
    image: curlimages/curl
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - >
        status=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST http://lakekeeper:8181/management/v1/bootstrap
        -H 'Content-Type: application/json'
        --data '{"accept-terms-of-use": true}');
        case "$$status" in 2??|409) exit 0 ;; esac;
        cat /tmp/resp >&2; echo "bootstrap failed with HTTP $$status" >&2; exit 1

  initialwarehouse:
    image: curlimages/curl
    depends_on:
      lakekeeper:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - >
        status=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST http://lakekeeper:8181/management/v1/warehouse
        -H 'Content-Type: application/json'
        --data @/config/create-warehouse.json);
        case "$$status" in 2??|409) exit 0 ;; esac;
        cat /tmp/resp >&2; echo "warehouse creation failed with HTTP $$status" >&2; exit 1
    volumes:
      - ../../docker/fixtures/create-warehouse.json:/config/create-warehouse.json:ro

  sentinel:
    image: alpine
    command: ["tail", "-f", "/dev/null"]
    depends_on:
      lakekeeper:
        condition: service_healthy
      initialwarehouse:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      retries: 1
      start_period: 0s

  data-seed:
    image: trinodb/trino:476
    profiles: ["seed"]
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - exec trino --server http://trino:8080 --user loader --file /seed/init-catalog.sql
    volumes:
      - ./init-catalog.sql:/seed/init-catalog.sql:ro
    depends_on:
      trino:
        condition: service_healthy
      sentinel:
        condition: service_healthy

volumes:
  queryflux-pg:
  lakekeeper-db:
  minio-data:
