# Same Trino + Cerbos stack as config.yaml but without catalogProvider — fail-closed
# when QueryFlux cannot resolve table columns (e.g. Bob + SELECT * + column masks).
#
# cargo run -p queryflux -- --config examples/with-cerbos/config-no-catalog.yaml

queryflux:
  externalAddress: http://localhost:8080
  frontends:
    trinoHttp:
      enabled: true
      port: 8080
  persistence:
    type: postgres
    url: postgres://queryflux:queryflux@127.0.0.1:5434/queryflux
  adminApi:
    port: 9000
    username: admin
    password: admin

auth:
  provider: static
  required: true
  staticUsers:
    users:
      alice:
        password: alice
        groups: [engineers]
        roles: [engineer]
      bob:
        password: bob
        groups: [analysts]
        roles: [analyst]

clusters:
  trino-1:
    engine: trino
    enabled: true
    endpoint: http://127.0.0.1:8081
    queryAuth:
      type: impersonate

clusterGroups:
  trino-cerbos:
    enabled: true
    maxRunningQueries: 4
    members: [trino-1]

routers:
  - type: protocolBased
    trinoHttp: trino-cerbos

routingFallback: trino-cerbos

translation:
  errorOnUnsupported: false

accessControl:
  defaultConnection: default
  connections:
    default:
      provider: cerbos
      cerbos:
        url: http://127.0.0.1:8184
        checkResourcesPath: /api/check/resources
        timeoutMs: 2000
      operations: [table.select]
      onMissingSchema: deny
      failOpen: false
      cacheTtlMs: 0
