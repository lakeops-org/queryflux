[package]
name = "embed-queryflux"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "embed-queryflux"
path = "src/main.rs"

[dependencies]
queryflux = { path = "../../crates/queryflux" }
queryflux-core = { path = "../../crates/queryflux-core" }
queryflux-frontend = { path = "../../crates/queryflux-frontend" }
queryflux-guardrails = { path = "../../crates/queryflux-guardrails" }
queryflux-routing = { path = "../../crates/queryflux-routing" }
queryflux-auth = { path = "../../crates/queryflux-auth" }
async-trait = "0.1.89"
arrow = "58.1.0"
axum = "0.8.8"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.149"
anyhow = "1.0.102"
