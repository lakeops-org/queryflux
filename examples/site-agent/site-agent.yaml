# Site agent: the site's only connection to the control plane. Workers connect to it as
# their control plane; it relays config down and fleet status and query history up.
queryflux:
  role: siteAgent
  adminApi:
    port: 9000
  siteAgent:
    # Workers behind this agent appear upstream as demo-site/worker-a, demo-site/worker-b.
    name: demo-site
    stateDir: /var/lib/queryflux/site-agent
    upstream:
      url: http://control-plane:9000
      # Plain HTTP is for this local demo only: snapshots carry cluster credentials.
      allowInsecureHttp: true
      auth:
        mode: sharedSecret
        sharedSecret: change-me-site-secret
    # What this site's workers present. Different from the upstream secret, so workers
    # never hold the site's upstream credential.
    sharedSecret: change-me-worker-secret
