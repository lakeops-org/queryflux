# Worker a: holds no config and has no route to the control plane. It talks only to the
# hub, exactly as it would to a control plane.
queryflux:
  role: worker
  workerSecret: change-me-worker-secret
  worker:
    name: worker-a
    upstream:
      url: http://hub:9000
      allowInsecureHttp: true
    coordination:
      mode: controlPlane         # share maxRunningQueries with every site, through the hub
      onUnavailable: localLimits # keep admitting on this worker's own limit if upstream is down
  externalAddress: http://localhost:8090
  frontends:
    trinoHttp:
      enabled: true
      port: 8080
  # Ops listener only: /health, /readyz, /metrics, /worker/status.
  adminApi:
    port: 9000
