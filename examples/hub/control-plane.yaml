# Control plane, standing in for a remote (for example hosted) one. It owns the config,
# serves it to the hub, shares capacity and stores query history.
queryflux:
  role: controlPlane
  # The hub presents this as hub.upstream.secret.
  workerSecret: change-me-site-secret
  persistence:
    type: postgres
    url: postgres://queryflux:queryflux@postgres:5432/queryflux
  configReloadIntervalSecs: 5
  adminApi:
    port: 9000
  # Each worker gets a share of every cluster's limit and admits within it locally, so
  # queries at the site do not wait on a round trip to the control plane.
  capacity:
    mode: quotas
  controlPlane:
    history:
      # full | maskLiterals | metadata. Applied by the workers and again by the hub.
      redaction: maskLiterals
  frontends:
    trinoHttp:
      enabled: false
      port: 8080

# Seeded into Postgres on first start; afterwards edit in Studio or the admin API.
clusters:
  duckdb-1:
    engine: duckDb
    # One limit for every worker at every site together.
    maxRunningQueries: 4
clusterGroups:
  analytics:
    members: [duckdb-1]
    maxRunningQueries: 4
routingFallback: analytics
