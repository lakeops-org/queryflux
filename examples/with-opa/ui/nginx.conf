# Demo UI: static page + proxies so the browser stays same-origin
# (no CORS). QueryFlux is on the host; OPA is the sibling service.
#
#   http://127.0.0.1:8183

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # QueryFlux Trino HTTP — live SQL (same path demo.py uses).
    location /v1/ {
        proxy_pass http://host.docker.internal:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8080;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
    }

    # QueryFlux admin (dry-run). extra_hosts maps this to the host.
    location /qf/ {
        proxy_pass http://host.docker.internal:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location /opa/ {
        proxy_pass http://opa:8181/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
