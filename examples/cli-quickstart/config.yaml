# A minimal QueryFlux configuration using the embedded DuckDB engine.
# This config requires NO external databases or containers.

queryflux:
  frontends:
    trinoHttp:
      enabled: true
      port: 8080
  adminApi:
    port: 9000

clusters:
  local-duckdb:
    engine: duckDb
    enabled: true

clusterGroups:
  default-group:
    enabled: true
    maxRunningQueries: 10
    members: [local-duckdb]

routers: []
routingFallback: default-group
