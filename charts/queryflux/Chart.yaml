apiVersion: v2
name: queryflux
description: Universal SQL multi-engine query router and proxy.
type: application
# Both follow the QueryFlux release (Release Please bumps them with Cargo.toml), so a chart
# version installs the server image of the same release: ghcr.io/lakeops-org/queryflux:v<appVersion>.
# Charts are published from 0.5.0, the first release whose bare tag is server-only (tags up to
# v0.4.0 also start Studio; set image.tag to v0.4.0-slim to run that release from a local chart).
version: 0.4.0
appVersion: "0.4.0"
home: https://queryflux.dev/
sources:
  - https://github.com/lakeops-org/queryflux
keywords:
  - sql
  - query
  - trino
  - duckdb
  - proxy
  - routing
maintainers:
  - name: LakeOps
    url: https://github.com/lakeops-org/queryflux
