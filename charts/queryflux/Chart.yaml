apiVersion: v2
name: queryflux
description: Universal SQL multi-engine query router and proxy.
type: application
# Both follow the QueryFlux release (Release Please bumps them with Cargo.toml), so a chart
# version installs the server image of the same release: v<appVersion>-slim. The -slim tag is
# the server-only image for every release; bare tags up to v0.4.0 also start Studio.
version: 0.4.0
appVersion: "0.4.0"
home: https://queryflux.dev/
sources:
  - https://github.com/lakeops-org/queryflux
keywords:
  - sql
  - query
  - trino
  - duckdb
  - proxy
  - routing
maintainers:
  - name: LakeOps
    url: https://github.com/lakeops-org/queryflux
