# Shared-service workers: a Deployment of workers that applications reach through a
# Service. Run the following from the repository root.
#
#   1. Fill in ./charts/queryflux/examples/worker-config.yaml and create its Secret in
#      the workers' namespace (here `queryflux`, next to the control plane):
#        kubectl -n queryflux create secret generic queryflux-worker-config \
#          --from-file=config.yaml=./charts/queryflux/examples/worker-config.yaml
#   2. helm install queryflux-workers ./charts/queryflux -n queryflux \
#        -f ./charts/queryflux/examples/worker-values.yaml
#
# For one worker per application pod, see worker-sidecar-manifest.yaml instead. To scale
# on load rather than a fixed count, add worker-autoscaling-values.yaml.

# The config is in a Secret the chart cannot read; this tells the install notes.
role: worker

replicaCount: 3

config:
  existingSecret: queryflux-worker-config

service:
  # A running query lives in the memory of the worker that started it, so its client must
  # keep reaching that worker: Trino result polls, Snowflake and MCP sessions.
  sessionAffinity: ClientIP
  # queryflux-workers-headless: every ready worker, for controlPlane.peerBootstrap.address.
  headless:
    enabled: true
  ports:
    # Workers serve no Studio and no admin API; port 9000 is the ops listener.
    studio:
      enabled: false

# /readyz turns 200 once the first config snapshot is active. Until then queries get a
# retryable "not configured" error, so the pod stays out of the Service. Allow time for
# a slow control plane on first start.
startupProbe:
  httpGet:
    path: /readyz
    port: admin
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 150

pdb:
  enabled: true
  maxUnavailable: 1
