# Site agent config (examples/site-agent-values.yaml mounts it from a Secret: it holds the
# site's upstream credential).
queryflux:
  role: siteAgent
  adminApi:
    port: 9000
  siteAgent:
    # Unique per upstream. This site's workers appear upstream as <name>/<worker name>.
    name: us-east-dc1
    # The persistent volume from site-agent-values.yaml.
    stateDir: /var/lib/queryflux/site-agent
    upstream:
      url: https://queryflux-control-plane.example.com:9000
      # This site's credential for upstream (upstream's controlPlane.sharedSecret).
      auth:
        mode: sharedSecret
        sharedSecret: change-me-site-secret
      pollTimeoutSecs: 30
      heartbeatIntervalSecs: 10
    # What this site's workers present as worker.upstream.auth.sharedSecret. Use a different
    # value from the upstream secret, so workers never hold the site's upstream credential.
    sharedSecret: change-me-worker-secret
    historySpool:
      maxBytes: 1073741824
