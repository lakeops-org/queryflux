queryflux:
  externalAddress: http://localhost:8080
  frontends:
    trinoHttp:
      enabled: true
      port: 8080
    postgresWire:
      enabled: false
      port: 5432
    # Snowflake JDBC/ODBC/Python wire + SQL API v2 on one port (sessions are process-local).
    # snowflakeHttp:
    #   enabled: false
    #   port: 8445
    #   sessionAffinityAcknowledged: false
    # MCP (Model Context Protocol) streamable-HTTP frontend for AI agent tool calls.
    # Authenticates via `Authorization: Bearer <token>` like other HTTP frontends — see
    # the `auth` section below. Guardrails (read-only, row limits, etc.) are configured
    # the same way as for every other frontend, via the top-level `guardrails` /
    # per-group guard config — nothing MCP-specific is enforced by default.
    # mcp:
    #   enabled: false
    #   port: 8811
  persistence:
    type: inMemory
  # --- Postgres persistence examples (pick one style) ---
  # Single URL:
  # persistence:
  #   type: postgres
  #   url: postgres://queryflux:queryflux@localhost:5432/queryflux
  # Or discrete fields (port defaults to 5432 if omitted):
  # persistence:
  #   type: postgres
  #   host: localhost
  #   port: 5432
  #   user: queryflux
  #   password: queryflux
  #   database: queryflux
  adminApi:
    port: 9000
    # Bootstrap admin credentials for the Admin REST API and Studio.
    # Change the password via the Studio Security page after first login — the new
    # bcrypt hash is stored in the database and these values are no longer used.
    # Override via env vars: QUERYFLUX_ADMIN_USER / QUERYFLUX_ADMIN_PASSWORD.
    username: admin
    password: admin
  # When persistence.type is postgres: how often (seconds) to poll the DB and refresh the in-memory
  # RouterChain + cluster/group state (default 30 if omitted). Set to 0 to disable polling only;
  # config still reloads immediately after routing/cluster/group writes via the admin API.
  # configReloadIntervalSecs: 60
  # queryHistoryRetentionDays: 90

clusterGroups:
  # trino-default:
  #   engine: trino
  #   maxRunningQueries: 100
  #   clusters:
  #     - name: trino-1
  #       endpoint: http://localhost:8081

  duckdb-local:
    engine: duckDb
    maxRunningQueries: 4
    clusters:
      - name: duckdb-1
        # databasePath: /tmp/queryflux.duckdb

translation:
  mode: bestEffort  # strict rejects required translation when unavailable or failed
  errorOnUnsupported: false
  # Optional Python scripts run after every sqlglot translation.
  # Each script must define: def transform(sql, src, dst) -> str
  # `sql` is the translated SQL text, `src`/`dst` are dialect names; return the
  # (possibly modified) SQL text. Scripts are given plain text, not a live AST,
  # so QueryFlux never binds you to a specific SQL library — parse `sql` with
  # sqlglot (or anything else) yourself if you need AST-level control.
  # pythonScripts:
  #   - |
  #     import sqlglot
  #     import sqlglot.expressions as exp
  #
  #     def transform(sql, src, dst) -> str:
  #         # Athena has no catalog layer — strip catalog from 3-part table references.
  #         # hive.my_db.my_table  →  my_db.my_table
  #         if dst != "athena":
  #             return sql
  #         ast = sqlglot.parse_one(sql, dialect=dst)
  #         for table in ast.find_all(exp.Table):
  #             table.set("catalog", None)
  #         return ast.sql(dialect=dst)
  # Max time to spend on catalog lookup (see `catalogProvider` below) before
  # falling back to dialect-only translation. Default 1500ms.
  # schemaResolutionTimeoutMs: 1500

# Native catalog integration — discovers table/column metadata so schema-aware SQL
# translation (sqlglot's optimizer) can qualify columns/types, not just transpile
# syntax. Defaults to `type: null` (no metadata, dialect-only translation only).
catalogProvider:
  type: null
  # --- Other provider examples ---
  # AWS Glue Data Catalog — direct Glue API access (format-agnostic: sees
  # Iceberg, Hive/Parquet, and any other table format Glue tracks). `auth` is
  # optional and follows the same shape as engine cluster `auth`; omit it to
  # use the default AWS credential chain (env vars, ECS task role, EC2
  # instance profile, etc.). `cache` is a field on the provider itself (not a
  # separate wrapper type) — Glue makes a real network call per uncached
  # lookup and table schemas rarely change, so a longer TTL than a query
  # result cache is normally safe; a `glue` config with no `cache` logs a
  # startup warning recommending one.
  # type: glue
  # region: us-east-1
  # auth:
  #   type: roleArn
  #   roleArn: arn:aws:iam::123456789012:role/queryflux-glue-readonly
  #   externalId: ${GLUE_EXTERNAL_ID}
  # cache:
  #   ttlSeconds: 300
  #   maxEntries: 10000
  #
  # Iceberg REST Catalog protocol — Polaris, Tabular, Unity's REST endpoint, or
  # Snowflake's Horizon endpoint for Snowflake-managed Iceberg tables. `uri` is
  # the catalog's REST endpoint; `catalogName` is just echoed back by
  # list_catalogs() (the protocol has no "list catalogs" call — one REST
  # endpoint *is* one catalog). `auth` is optional; omit for an unauthenticated
  # (e.g. local dev) catalog server.
  # type: icebergRest
  # uri: https://polaris.example.com/api/catalog
  # warehouse: s3://my-bucket/warehouse
  # catalogName: prod
  # auth:
  #   type: oauth2ClientCredentials
  #   clientId: ${ICEBERG_REST_CLIENT_ID}
  #   clientSecret: ${ICEBERG_REST_CLIENT_SECRET}
  # cache:
  #   ttlSeconds: 300
  #   maxEntries: 10000
  #
  # Raw Hive Metastore Thrift protocol — format-agnostic (plain Hive/Parquet
  # tables, not just Iceberg-format ones registered in HMS).
  # type: hiveMetastore
  # uri: thrift://localhost:9083
  # cache:
  #   ttlSeconds: 300
  #   maxEntries: 10000
  #
  # Try a primary provider, fall back to a secondary on error (or a missing
  # table, for get_table_schema specifically). Note: "null" must be quoted here —
  # a bare YAML `null` parses as YAML's null type, not the string tag `type` expects.
  # type: fallback
  # primary:
  #   type: glue
  #   region: us-east-1
  #   cache: { ttlSeconds: 300, maxEntries: 10000 }
  # secondary:
  #   type: "null"

routers:
  - type: protocolBased
    postgresWire: trino-default
  # Example: route only when ALL conditions match (AND)
  # - type: compound
  #   combine: all
  #   conditions:
  #     - type: protocol
  #       protocol: mysqlWire
  #     - type: header
  #       headerName: X-Env
  #       headerValue: prod
  #   targetGroup: duckdb-local

routingFallback: duckdb-local

# Data-level access control (row filtering, column masking, table/column allow-deny).
# Runs on the source SQL before dialect translation, as a guard in the same pipeline
# stage as `guardrails` above. Omit this section to disable entirely. See
# website/docs/access-control/overview.md and access-control/opa.md.
# accessControl:
#   enabled: true                      # global default; per-group `enabled` override below
#   # `defaultConnection` names which entry under `connections` a cluster group uses when it
#   # has no explicit `groups.<name>.connection` override. No connection name is reserved —
#   # if you omit `defaultConnection`, a group with no explicit override gets NO access
#   # control at all (nothing to route it to). Most deployments name one connection here and
#   # never touch `groups.<name>.connection`; add another connection only when a group
#   # genuinely needs a different endpoint (network segmentation, blast-radius isolation, a
#   # per-team OPA during a provider migration) — for "different rules per team on the same
#   # OPA", branch in Rego on input.context.clusterGroup instead of adding a connection.
#   defaultConnection: prod
#   connections:
#     prod:
#       provider: opa                  # the only provider today, and the default
#       opa:
#         url: http://localhost:8181
#         decisionPath: /v1/data/queryflux/access
#         timeoutMs: 1000
#         # bearerToken: "..."
#         # clientCredentials: { clientId: ..., clientSecret: ..., tokenEndpoint: ... }
#       operations: [table.select]     # add table.insert/update/delete to cover writes
#       onMissingSchema: evaluate      # evaluate (send all-columns) | deny
#       failOpen: false                # provider timeout/error denies by default
#       cacheTtlMs: 5000               # decision cache; 0 disables
#       sessionParamKeys: [customer_id]  # SessionContext.extra keys forwarded as context only
#     # eu-sandbox:                    # optional: a second connection for a segmented group
#     #   opa: { url: https://eu-opa.internal, decisionPath: /v1/data/queryflux/access }
#   groups:
#     trino-prod: { failOpen: false }  # inherits `defaultConnection` (prod)
#     sandbox: { enabled: false }      # skip access control entirely for this cluster group
#     # eu-group: { connection: eu-sandbox }   # route this group to the "eu-sandbox" connection instead
