name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE*'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/DISCUSSION_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - 'LICENSE*'

# One active run per PR: a new push cancels the previous in-progress run for the same PR.
# All main pushes share one group too (github.ref is constant across them), so they still
# run one at a time — but never cancelled: a squash-merge's run should always run to
# completion rather than losing CI coverage for a commit because another merge landed right
# behind it. `queue: max` (vs. the default `single`) matters here too: with the default, a
# second push arriving while one push run is already queued would bump that queued run out
# in favor of the newest one, silently dropping CI for that commit even though nothing was
# "cancelled" in the visible sense — `max` keeps every pending main run queued instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

env:
  RUST_TOOLCHAIN_VERSION: "1.91.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # libduckdb-sys: system libduckdb (.so + headers) from install-libduckdb.sh; mold linker in rust job.
  DUCKDB_LIB_DIR: /usr/local/lib
  DUCKDB_INCLUDE_DIR: /usr/local/include
  # Must match duckdb crate version: duckdb 1.85.1 → libduckdb-sys 1.10501.0 → DuckDB v1.5.1.
  DUCKDB_VERSION: "1.5.1"
  # libduckdb-linux-amd64.zip for DUCKDB_VERSION (verify when bumping version).
  DUCKDB_LIBDUCKDB_LINUX_AMD64_SHA256: "21aec66a60eae1696270ba715a481ab066a88d99a62718d0577579ac1a7a4834"

jobs:
  # Draft PRs skip all CI jobs (push to main still runs). Mark ready for review to trigger checks.
  gate:
    name: PR ready
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI enabled"

  # Fast gate — nothing else runs until fmt passes.
  fmt:
    name: Check formatting
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
      - uses: dtolnay/rust-toolchain@d8352f6b1d2e870bc5716e7a6d9b65c4cc244a1a
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  helm:
    name: Helm chart
    needs: [gate, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: make helm-check

  # docker/adbc-drivers.sh against the real dbc registry, in containers built from the
  # Dockerfile's `dbc` stage — cheap, needs no QueryFlux build.
  adbc-drivers:
    name: ADBC driver install script
    needs: [gate, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        with:
          filters: |
            adbc:
              - 'docker/**'
              - 'scripts/test-adbc-drivers.sh'
              - '.github/workflows/ci.yml'
      - if: github.event_name == 'push' || steps.paths.outputs.adbc == 'true'
        run: bash scripts/test-adbc-drivers.sh

  # The `rust` job below is expensive (up to 120min: compile, clippy, unit, Postgres, and a
  # Docker-based e2e stack) — a PR needs a maintainer's approval before it runs, so it
  # doesn't burn CI minutes on every push before anyone has looked at the PR. A push to
  # main (already reviewed via the PR that merged it) does not need that approval.
  #
  # This is two tiny, mutually-exclusive gate jobs — one per trigger type, each `if:`-
  # skipped for the other — rather than a conditional `environment:` expression on `rust`
  # itself: GitHub Actions doesn't clearly document what an empty/null environment-name
  # expression does, so `environment:` here is only ever a fixed, always-present string.
  # `rust`'s own `if:` (below) then requires each of these to be either `success` or
  # `skipped`, never `failure`.
  approval-gate-pr:
    name: CI approval (PR)
    needs: gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ci-approval
    steps:
      - run: echo "Approved — starting the Rust job."

  approval-gate-push:
    name: CI approval (push)
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push event — no approval gate."

  # One compile: clippy (--all-targets) then unit + Postgres + optional E2E reuse the same target dir.
  rust:
    name: Rust (clippy, unit & E2E)
    needs: [gate, fmt, approval-gate-pr, approval-gate-push]
    # Exactly one of the two gate jobs above actually runs (the other is skipped by its own
    # `if:`) — proceed once whichever one ran has succeeded, and neither has failed.
    # `!cancelled()`, not `always()`: this must still respect a cancelled run (e.g. a new
    # push superseding this one via `concurrency: cancel-in-progress`) — `always()` would
    # start this 120min job regardless.
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.fmt.result == 'success' &&
      (needs.approval-gate-pr.result == 'success' || needs.approval-gate-pr.result == 'skipped') &&
      (needs.approval-gate-push.result == 'success' || needs.approval-gate-push.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Faster CI dev builds: no debuginfo, mold linker (see corrode compile-times tips).
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: queryflux_test
          POSTGRES_USER: queryflux
          POSTGRES_PASSWORD: queryflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queryflux -d queryflux_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        with:
          filters: |
            e2e:
              - 'crates/**'
              - 'docker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'requirements.txt'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

      # E2E prep, in the background so it overlaps the Rust build instead of running after it:
      #  - free disk: e2e once ran the runner out of disk (Mar 2026). Deleting the Android SDK,
      #    .NET and GHC frees ~20GiB; a blocking jlumbroso/free-disk-space step took 2-4.5 min.
      #  - pull the e2e images (~55s of the ~75s it took to bring the stack up).
      # Background processes outlive their step (the runner reaps them at job end); "Wait for
      # e2e prep" below blocks on the marker files before the stack starts.
      - name: Start e2e prep in background (free disk, pull images)
        if: github.event_name == 'push' || steps.paths.outputs.e2e == 'true'
        run: |
          prep="${RUNNER_TEMP}/e2e-prep"
          mkdir -p "$prep"
          nohup bash -c '
            df -h /
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            df -h /
            touch "$0/cleanup.done"
          ' "$prep" > "$prep/cleanup.log" 2>&1 &
          nohup bash -c '
            docker compose -f docker/docker-compose.test.yml --project-directory . \
              pull --quiet --include-deps trino starrocks clickhouse sentinel
            echo $? > "$0/pull.exit"
          ' "$prep" > "$prep/pull.log" 2>&1 &

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install libduckdb
        run: bash scripts/install-libduckdb.sh

      - uses: dtolnay/rust-toolchain@d8352f6b1d2e870bc5716e7a6d9b65c4cc244a1a
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: clippy

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: queryflux
          cache-on-failure: true
          cache-all-crates: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python venv (sqlglot / PyO3)
        run: |
          # Virtualenv interpreter links are tied to the runner's Python installation.
          # Cache pip downloads above, and recreate the environment for this runner.
          python3 -m venv --clear .venv
          .venv/bin/python3 -m pip install -r requirements.txt
          echo "PYO3_PYTHON=${GITHUB_WORKSPACE}/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$(.venv/bin/python3 -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"

      # Clippy first — fail fast before tests or E2E. --all-targets compiles test crates once for later steps.
      # Exclude queryflux-bench: duplicate link of main stack; benchmark.yml builds it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --exclude queryflux-bench -- -D warnings

      - name: Unit & integration tests (nextest)
        run: make test

      # Postgres ignored tests share one DATABASE_URL, migrate() on setup, and a static
      # CAPACITY_TEST_LOCK — they must run in one process (cargo test), not nextest
      # (which spawns each lib test in its own process).
      - name: Postgres integration tests (queryflux-persistence)
        env:
          DATABASE_URL: postgres://queryflux:queryflux@localhost:5432/queryflux_test
        run: cargo test -p queryflux-persistence -- --include-ignored

      # E2E: always on main pushes; on PRs only when runtime/docker paths change.
      - name: Wait for e2e prep (disk cleanup, image pull)
        if: github.event_name == 'push' || steps.paths.outputs.e2e == 'true'
        run: |
          prep="${RUNNER_TEMP}/e2e-prep"
          timeout 600 bash -c "until [ -e '$prep/cleanup.done' ] && [ -e '$prep/pull.exit' ]; do sleep 2; done" \
            || echo "::warning::e2e prep still running after 10 min — continuing"
          echo "--- disk cleanup"; cat "$prep/cleanup.log" || true
          echo "--- image pull"; cat "$prep/pull.log" || true
          # A failed pull isn't fatal: `up` below pulls whatever is missing, with retries.
          if [ "$(cat "$prep/pull.exit" 2>/dev/null)" != "0" ]; then
            echo "::warning::background image pull failed — docker compose up will retry the pull"
          fi

      - name: Install Trino ADBC driver (dbc)
        if: github.event_name == 'push' || steps.paths.outputs.e2e == 'true'
        run: |
          bash scripts/install-adbc-trino-driver.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Start e2e Docker stack (Trino + StarRocks + ClickHouse + sentinel)
        if: github.event_name == 'push' || steps.paths.outputs.e2e == 'true'
        run: |
          # `docker compose up` occasionally fails on a transient registry error — e.g. quay.io
          # returning 401 "unauthorized" for an anonymous pull once a shared runner IP hits its
          # rate limit, not because the (public) image is actually gone. `up -d --wait` is safe
          # to retry: already-healthy services are left alone, only what didn't come up gets
          # retried.
          for attempt in 1 2 3; do
            if docker compose -f docker/docker-compose.test.yml --project-directory . up -d --wait --wait-timeout 300 trino starrocks clickhouse sentinel; then
              exit 0
            fi
            echo "::warning::e2e stack failed to start (attempt ${attempt}/3)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      - name: E2E tests (queryflux-e2e-tests)
        if: github.event_name == 'push' || steps.paths.outputs.e2e == 'true'
        env:
          TRINO_URL: http://localhost:18081
          # Trino rejects statements without a user; the test Trino has no auth, so any name works.
          TRINO_ADBC_URI: http://queryflux@localhost:18081
          # The driver is installed and Trino is up in CI — a skip here would hide a real failure.
          TRINO_ADBC_REQUIRED: "1"
          STARROCKS_URL: mysql://root@localhost:9030
          CLICKHOUSE_URL: http://localhost:18123
          LAKEKEEPER_URL: http://localhost:18181
          RUSTFS_ENDPOINT: localhost:19000
        # Reuse `make test`'s build: `cargo test --no-run` with exactly the selection nextest used
        # is a no-op, and its JSON lists the e2e test binaries, which we then run directly.
        # Any narrower selection (`-p queryflux-e2e-tests`, or `--workspace --test=<e2e target>`)
        # changes feature unification — via package selection or other crates' dev-dependencies —
        # and recompiles every workspace crate (~60s).
        # One process per binary with --test-threads=1 (like `cargo test`), not nextest: each e2e
        # binary shares one in-process TestHarness / Iceberg seed across its tests.
        run: |
          mapfile -t e2e_bins < <(cargo test --no-run --workspace --exclude queryflux-bench \
              --message-format json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test
                       and (.target.kind | index("test"))
                       and (.package_id | contains("queryflux-e2e-tests"))) | .executable')
          if [ "${#e2e_bins[@]}" -eq 0 ]; then
            echo "::error::no queryflux-e2e-tests test binaries found"; exit 1
          fi
          failed=()
          for bin in "${e2e_bins[@]}"; do
            echo "::group::$(basename "$bin")"
            (cd crates/queryflux-e2e-tests && "$bin" --test-threads=1 --include-ignored) || failed+=("$(basename "$bin")")
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::failed e2e binaries: ${failed[*]}"; exit 1
          fi

      # Peak disk usage, to know how much headroom the background cleanup actually leaves.
      - name: Disk usage
        if: always() && (github.event_name == 'push' || steps.paths.outputs.e2e == 'true')
        run: |
          df -h /
          du -sh target 2>/dev/null || true
          docker system df || true

      - name: Engine logs (debug on failure)
        if: failure() && (github.event_name == 'push' || steps.paths.outputs.e2e == 'true')
        run: |
          docker compose -f docker/docker-compose.test.yml --project-directory . logs --no-color --tail=200 trino || true
          docker compose -f docker/docker-compose.test.yml --project-directory . logs --no-color --tail=200 starrocks || true
          docker compose -f docker/docker-compose.test.yml --project-directory . logs --no-color --tail=200 clickhouse || true

      - name: Stop e2e Docker stack
        if: always() && (github.event_name == 'push' || steps.paths.outputs.e2e == 'true')
        run: docker compose -f docker/docker-compose.test.yml --project-directory . down

  # ── Benchmarks ──────────────────────────────────────────────────────────────────────────
  # Run only when QueryFlux itself changes. website/** and *.md never reach here (the
  # workflow's paths-ignore); this narrows further so helm/docker-only PRs skip benches.
  # PRs get CodSpeed (cheap, deterministic); the wall-clock proxy benchmark runs on main
  # merges here and on PRs only via the `benchmark` label (proxy-bench.yml).
  bench-changes:
    name: Benchmark paths
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: paths
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'benches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'requirements.txt'
              - 'scripts/bench/**'
              - '.github/workflows/ci.yml'

  # Micro-benchmarks (crates/*/benches) under CodSpeed's simulation mode: CPU instructions are
  # counted, not wall-clock time, so results are deterministic on shared runners (<1% noise).
  # CodSpeed compares each PR against main and posts its own PR comment; main pushes record
  # the baseline. It never fails this job on a regression — it only reports.
  codspeed:
    name: Micro-benchmarks (CodSpeed)
    needs: [gate, fmt, approval-gate-pr, approval-gate-push, bench-changes]
    if: |
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.fmt.result == 'success' &&
      (needs.approval-gate-pr.result == 'success' || needs.approval-gate-pr.result == 'skipped') &&
      (needs.approval-gate-push.result == 'success' || needs.approval-gate-push.result == 'skipped') &&
      needs.bench-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC auth to CodSpeed — no token secret needed
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d8352f6b1d2e870bc5716e7a6d9b65c4cc244a1a
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-codspeed@5.0.3

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python venv (sqlglot / PyO3)
        run: |
          python3 -m venv --clear .venv
          .venv/bin/python3 -m pip install -r requirements.txt
          echo "PYO3_PYTHON=${GITHUB_WORKSPACE}/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$(.venv/bin/python3 -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"

      - name: Build benchmarks
        run: >-
          cargo codspeed build
          -p queryflux-fingerprint -p queryflux-routing
          -p queryflux-translation -p queryflux-guardrails

      - uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run

  # End-to-end proxy overhead, head-only, on every main merge that touches Rust. On PRs it is
  # opt-in via the `benchmark` label instead (wall-clock + two release builds is too costly
  # and too noisy per PR) — see proxy-bench.yml.
  proxy-bench:
    name: Proxy benchmark (main)
    needs: [gate, fmt, bench-changes]
    if: |
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.gate.result == 'success' &&
      needs.fmt.result == 'success' &&
      needs.bench-changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/proxy-bench.yml

  # Main only: append this run to the `benchmark-data` branch (history.json / latest.json),
  # which deploy-website.yml pulls into the Benchmarks page, and compare it with recent main
  # history (scripts/bench/publish.py). On a jump, warn and comment on the merged PR — the
  # safety net for PRs that didn't get the opt-in A/B. Separate job so the write token never
  # shares a job with the benchmark build.
  bench-publish:
    name: Publish benchmark results
    needs: proxy-bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.proxy-bench.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # comment on the merged PR when the jump check fires
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          sparse-checkout: scripts/bench
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: proxy-bench
          path: bench-results

      - name: Push to benchmark-data branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3; do
            rm -rf data jump.md && git init --quiet data
            if git -C data fetch --quiet --depth 1 "$remote" benchmark-data; then
              git -C data checkout --quiet -b benchmark-data FETCH_HEAD
            else
              git -C data checkout --quiet --orphan benchmark-data
            fi
            python3 scripts/bench/publish.py bench-results/head-median.json data \
              --commit "$SHA" --report-out jump.md
            git -C data add -A
            git -C data commit --quiet -m "bench: proxy overhead @ ${SHA::12}"
            git -C data push --quiet "$remote" benchmark-data && exit 0
            echo "::warning::push to benchmark-data failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Flag jump on the merged PR
        if: steps.publish.outputs.jump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cat jump.md >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Proxy benchmark::Proxy overhead jumped vs recent main runs — see the job summary."
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F body=@jump.md > /dev/null
          fi
