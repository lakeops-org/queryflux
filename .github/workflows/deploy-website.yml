name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  # Rebuild nightly so sitemap lastmod stays fresh (seoConfig.ts sets lastmod to build date)
  # and /benchmarks picks up the latest main-branch results.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      # ci.yml `bench-publish` keeps proxy benchmark results on the `benchmark-data` branch.
      # Missing branch (e.g. forks) → keep the committed fallback data.
      - name: Fetch benchmark results
        run: |
          if git fetch --depth 1 origin benchmark-data; then
            git show FETCH_HEAD:proxy/latest.json > src/data/benchmarks/proxy-latest.json
            git show FETCH_HEAD:proxy/history.json > src/data/benchmarks/proxy-history.json
          else
            echo "::notice::no benchmark-data branch — using committed benchmark data"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build website
        env:
          # Optional override; defaults in website/analytics/openpanel.ts
          OPENPANEL_CLIENT_ID: ${{ vars.OPENPANEL_CLIENT_ID }}
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
