# Verify server-only image on PRs (host platform only, no push).
# Unified (server+studio) image is built on release — see release.yml / docker-publish-tag.yml.
#   One Dockerfile: docker/queryflux/Dockerfile — targets runtime-server | runtime-unified

name: Docker — QueryFlux (verify)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'crates/**'
      - 'docker/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'requirements.txt'
      - 'queryflux-studio/**'
      - 'scripts/**'
      - '.github/workflows/docker-verify.yml'

# New pushes to the same PR cancel an in-progress docker verify run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-verify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server-only (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/queryflux/Dockerfile
          target: runtime-server
          push: false
          load: true
          tags: queryflux:pr-verify-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CARGO_BUILD_JOBS=4
