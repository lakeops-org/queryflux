name: Capacity benchmark

# Capacity admission benchmark (`queryflux-bench capacity`): simulated workers acquiring and
# releasing capacity leases against Postgres, in process and through the control plane's
# worker API, with a cap-violation checker that fails the run on any violation. Weekly, so
# admission changes have a trend line; numbers from shared runners are noisy, compare runs
# against each other rather than against laptop baselines.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      duration_secs:
        description: Measured seconds per scenario
        default: "20"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN_VERSION: "1.91.1"
  CARGO_TERM_COLOR: always
  # The bench links queryflux-frontend, which needs libduckdb (see ci.yml).
  DUCKDB_LIB_DIR: /usr/local/lib
  DUCKDB_INCLUDE_DIR: /usr/local/include
  DUCKDB_VERSION: "1.5.1"
  DUCKDB_LIBDUCKDB_LINUX_AMD64_SHA256: "21aec66a60eae1696270ba715a481ab066a88d99a62718d0577579ac1a7a4834"

jobs:
  capacity:
    name: Capacity admission benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: queryflux_bench
          POSTGRES_USER: queryflux
          POSTGRES_PASSWORD: queryflux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queryflux -d queryflux_bench"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://queryflux:queryflux@localhost:5432/queryflux_bench
    steps:
      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5
        with:
          persist-credentials: false

      # Service containers cannot take server flags, so load pg_stat_statements (for
      # statements/s) with ALTER SYSTEM and restart the container.
      - name: Enable pg_stat_statements
        env:
          PGPASSWORD: queryflux
        run: |
          psql -h localhost -U queryflux -d queryflux_bench \
            -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'" \
            -c "ALTER SYSTEM SET max_connections = 400"
          docker restart "${{ job.services.postgres.id }}"
          timeout 60 bash -c 'until pg_isready -h localhost -U queryflux -d queryflux_bench; do sleep 1; done'
          psql -h localhost -U queryflux -d queryflux_bench \
            -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements" -c "SHOW fsync"

      - name: Install libduckdb
        run: bash scripts/install-libduckdb.sh

      - uses: dtolnay/rust-toolchain@d8352f6b1d2e870bc5716e7a6d9b65c4cc244a1a
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: queryflux-bench
          cache-on-failure: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python venv (PyO3 link)
        run: |
          python3 -m venv --clear .venv
          .venv/bin/python3 -m pip install -r requirements.txt
          echo "PYO3_PYTHON=${GITHUB_WORKSPACE}/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$(.venv/bin/python3 -c 'import site; print(site.getsitepackages()[0])')" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p queryflux-bench

      - name: Run lease scenarios
        env:
          DURATION: ${{ github.event.inputs.duration_secs || '20' }}
        run: |
          set -o pipefail
          target/release/queryflux-bench capacity \
            --scenario all --transport both \
            --duration-secs "$DURATION" --warmup-secs 3 \
            --json capacity-bench.json | tee capacity-bench.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Capacity benchmark'
            echo
            echo "Runner: $(nproc) CPUs, Postgres 17 service container. Indicative only."
            echo
            cat capacity-bench.txt 2>/dev/null || echo 'No results (see the run step).'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capacity-bench-${{ github.run_number }}
          path: |
            capacity-bench.json
            capacity-bench.txt
          if-no-files-found: warn
          retention-days: 90
